/* --- subway lines: ordered lists of station ids, authored by hand ---------- */
const LINE_TOOLS = {subwayline:'subway', tramline:'tram'};
const LINE_TOOL = 'subwayline';
const STOP_TYPE = {subway:'subway', tram:'tramstop'};
const isLineTool = () => !!LINE_TOOLS[state.tool];
const lineMode = () => LINE_TOOLS[state.tool] || 'subway';
const isTransitTool = t => !!LINE_TOOLS[t] || (TYPES[t] && TYPES[t].kind === 'transit');
const modeOf = L => L.mode || 'subway';
let drawLine = -1;               // index of the line currently being drawn

const isStop = o => o && (o.type === 'subway' || o.type === 'tramstop');
function stationByUid(u){
  for(const o of state.objects) if(o.uid === u && isStop(o)) return o;
  return null;
}
function stationAt(gx, gz, type){
  for(let r = 0; r <= 2; r++){
    for(let dx = -r; dx <= r; dx++) for(let dz = -r; dz <= r; dz++){
      if(Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
      const ax = gx + dx, az = gz + dz;
      if(ax < 0 || az < 0 || ax >= GRID || az >= GRID) continue;
      const i = occ[oi(ax, az)];
      const o = i === -1 ? null : state.objects[i];
      if(o && (type ? o.type === type : isStop(o))) return o;
    }
  }
  return null;
}
function pruneLines(){
  const live = new Set();
  for(const o of state.objects) if(isStop(o)) live.add(o.uid);
  for(const L of state.lines){
    const out = [];
    for(const u of L.stops) if(live.has(u) && out[out.length - 1] !== u) out.push(u);
    L.stops = out;
  }
  state.lines = state.lines.filter((L, i) => L.stops.length > 1 || i === drawLine);
  if(drawLine >= state.lines.length) drawLine = -1;
}
function lineOfStation(u){
  const out = [];
  state.lines.forEach((L, i) => { if(L.stops.includes(u)) out.push(i); });
  return out;
}
/* Chain loose stations into a sensible line: greedy nearest neighbour, split
   into runs that share a station so the network stays connected. */
function autoLines(stations, startColour, mode){
  if(stations.length < 2) return [];
  const rest = stations.slice();
  let cur = rest.reduce((a, b) => (a.gx + a.gz < b.gx + b.gz ? a : b));
  rest.splice(rest.indexOf(cur), 1);
  const chain = [cur];
  while(rest.length){
    let bi = 0, bd = Infinity;
    for(let i = 0; i < rest.length; i++){
      const d = (rest[i].gx - cur.gx) ** 2 + (rest[i].gz - cur.gz) ** 2;
      if(d < bd){ bd = d; bi = i; }
    }
    cur = rest[bi]; rest.splice(bi, 1);
    chain.push(cur);
  }
  const n = chain.length <= 5 ? 1 : chain.length <= 9 ? 2 : 3;
  const per = Math.ceil((chain.length - 1) / n);
  const made = [];
  for(let i = 0; i < n; i++){
    const a = i * per, b = Math.min(chain.length - 1, a + per);
    if(b - a < 1) break;
    made.push({mode: mode || 'subway', c: ((startColour || 0) + made.length) % METRO_COLS.length,
               stops: chain.slice(a, b + 1).map(o => o.uid)});
  }
  return made;
}

/* ============================================================================
   8.  STREET NETWORK GRAPH + ROUTING
   ========================================================================== */

let NX = Math.floor((GRID - PITCH) / PITCH) + 1;    // nodes per axis
const nodeGX = i => PITCH - 1 + i * PITCH;
let NN = NX * NX;

const G = {
  ok: new Uint8Array(NN),
  x: new Float32Array(NN), z: new Float32Array(NN),
  adj: [],                 // per node: [{to, len, kind}]
  stations: [],
};
const MODES = ['walk', 'bike', 'transit'];
const MODE_SPEED = {walk:{walk:1, bike:1, tram:1, subway:0.02},
                    bike:{walk:1, bike:2.4, tram:1, subway:0.02},
                    transit:{walk:1, bike:1.6, tram:4.2, subway:9}};
const SEG_VIS_SPEED = {walk:1.0, bike:2.0, tram:3.6, subway:7.0};

function nodeIdx(ix, iz){ return ix * NX + iz; }
function nearestNode(x, z){
  let ix = clamp(Math.round((x / CELL + HALF - (PITCH - 1) - 0.5) / PITCH), 0, NX - 1);
  let iz = clamp(Math.round((z / CELL + HALF - (PITCH - 1) - 0.5) / PITCH), 0, NX - 1);
  let best = -1, bd = Infinity;
  for(let dx = -2; dx <= 2; dx++) for(let dz = -2; dz <= 2; dz++){
    const a = ix + dx, b = iz + dz;
    if(a < 0 || b < 0 || a >= NX || b >= NX) continue;
    const n = nodeIdx(a, b);
    if(!G.ok[n]) continue;
    const d = (G.x[n] - x) ** 2 + (G.z[n] - z) ** 2;
    if(d < bd){ bd = d; best = n; }
  }
  return best;
}

function buildGraph(){
  G.adj = new Array(NN);
  G.stations.length = 0;
  const netAt = new Map();   // "gx,gz" -> Set of net kinds
  for(const o of state.objects){
    const T = TYPES[o.type];
    if(T.kind !== 'transit') continue;
    const k = o.gx + ',' + o.gz;
    if(!netAt.has(k)) netAt.set(k, new Set());
    netAt.get(k).add(T.net);
  }
  for(let ix = 0; ix < NX; ix++) for(let iz = 0; iz < NX; iz++){
    const n = nodeIdx(ix, iz);
    const gx = nodeGX(ix), gz = nodeGX(iz);
    const x = wx(gx), z = wz(gz);
    G.x[n] = x; G.z[n] = z;
    const under = occ[oi(gx, gz)];
    const uo = under === -1 ? null : state.objects[under];
    const blocked = uo && TYPES[uo.type].spans && TYPES[uo.type].kind === 'building';
    G.ok[n] = (shoreZ(x) - z > 17 && !blocked) ? 1 : 0;
    G.adj[n] = [];
  }
  G.stationNode = new Map();
  for(const o of state.objects){
    if(!isStop(o)) continue;
    const n = nearestNode(wx(o.gx), wz(o.gz));
    if(n < 0) continue;
    G.stationNode.set(o.uid, n);
    if(o.type === 'subway' && !G.stations.includes(n)) G.stations.push(n);
  }
  const link = (a, b, cells) => {
    if(!G.ok[a] || !G.ok[b]) return;
    let tram = 0, bike = 0, walk = 0;
    for(const c of cells){
      const s = netAt.get(c[0] + ',' + c[1]);
      if(!s) continue;
      if(s.has('tram')) tram++;
      if(s.has('bike')) bike++;
      if(s.has('walk')) walk++;
    }
    const len = Math.hypot(G.x[a] - G.x[b], G.z[a] - G.z[b]);
    const frac = cells.length || 1;
    const kind = tram / frac >= 0.55 ? 'tram' : bike / frac >= 0.5 ? 'bike' : 'walk';
    const e1 = {to:b, len, kind}, e2 = {to:a, len, kind};
    G.adj[a].push(e1); G.adj[b].push(e2);
  };
  for(let ix = 0; ix < NX; ix++) for(let iz = 0; iz < NX; iz++){
    const n = nodeIdx(ix, iz);
    if(ix < NX - 1){
      const cells = [];
      for(let g = nodeGX(ix); g <= nodeGX(ix + 1); g++) cells.push([g, nodeGX(iz)]);
      link(n, nodeIdx(ix + 1, iz), cells);
    }
    if(iz < NX - 1){
      const cells = [];
      for(let g = nodeGX(iz); g <= nodeGX(iz + 1); g++) cells.push([nodeGX(ix), g]);
      link(n, nodeIdx(ix, iz + 1), cells);
    }
  }
  // tram: lines follow the streets between their stops, and lay track as they go
  PATHS.clear();
  G.tramPaths = [];
  G.linked = new Set();
  state.lines.forEach((L, li) => {
    if(modeOf(L) !== 'tram') return;
    const nodes = [];                       // lattice nodes, for routing
    const way = [];                         // cell waypoints, for track and vehicles
    let prevStop = null;
    for(const u of L.stops){
      G.linked.add(u);
      const st = stationByUid(u);
      const n = G.stationNode.get(u);
      if(!st || n === undefined || !G.ok[n]) continue;
      if(!prevStop){
        way.push({gx:st.gx, gz:st.gz, stop:true});
        nodes.push(n);
        prevStop = {st, n};
        continue;
      }
      const seg = routeNodes('walk', prevStop.n, n) || [prevStop.n, n];
      for(let k = 0; k < seg.length; k++){
        const q = seg[k];
        way.push({gx: nodeGX(Math.floor(q / NX)), gz: nodeGX(q % NX), stop:false});
        if(k > 0 || nodes[nodes.length - 1] !== q) nodes.push(q);
      }
      way.push({gx:st.gx, gz:st.gz, stop:true});
      prevStop = {st, n};
    }
    if(way.length < 2) return;
    // straighten: drop waypoints that sit on a straight run, but never a stop
    const pts = [];
    for(let i = 0; i < way.length; i++){
      const w = way[i];
      const last = pts[pts.length - 1];
      if(last && last.gx === w.gx && last.gz === w.gz){ last.stop = last.stop || w.stop; continue; }
      pts.push({gx:w.gx, gz:w.gz, stop:w.stop});
    }
    for(let i = pts.length - 2; i > 0; i--){
      const a = pts[i - 1], b = pts[i], c2 = pts[i + 1];
      if(b.stop) continue;
      if((a.gx === b.gx && b.gx === c2.gx) || (a.gz === b.gz && b.gz === c2.gz)) pts.splice(i, 1);
    }
    if(pts.length < 2) return;
    // every street cell the line runs through
    const cells = new Map();
    let ok = true;
    for(let i = 0; i < pts.length - 1 && ok; i++){
      const a = pts[i], b = pts[i + 1];
      if(a.gx !== b.gx && a.gz !== b.gz){ ok = false; break; }
      const horiz = a.gz === b.gz;
      const from = horiz ? Math.min(a.gx, b.gx) : Math.min(a.gz, b.gz);
      const to = horiz ? Math.max(a.gx, b.gx) : Math.max(a.gz, b.gz);
      for(let g = from; g <= to; g++){
        const gx = horiz ? g : a.gx, gz = horiz ? a.gz : g;
        const key = gx + ',' + gz;
        const e = cells.get(key) || {gx, gz, x:false, z:false};
        if(horiz) e.x = true; else e.z = true;
        cells.set(key, e);
      }
    }
    if(!ok) return;
    G.tramPaths.push({c: L.c | 0, li, nodes,
                      pts: pts.map(w => ({x: wx(w.gx), z: wz(w.gz), stop: w.stop})),
                      cells: [...cells.values()]});
    for(let i = 0; i < nodes.length - 1; i++){
      const a = nodes[i], b = nodes[i + 1];
      if(a === b) continue;
      const len = Math.hypot(G.x[a] - G.x[b], G.z[a] - G.z[b]);
      G.adj[a].push({to:b, len, kind:'tram'});
      G.adj[b].push({to:a, len, kind:'tram'});
    }
  });

  // subway: whatever lines I have drawn
  G.metro = [];
  for(const L of state.lines){
    if(modeOf(L) !== 'subway') continue;
    for(let i = 0; i < L.stops.length - 1; i++){
      const a = G.stationNode.get(L.stops[i]), b = G.stationNode.get(L.stops[i + 1]);
      G.linked.add(L.stops[i]); G.linked.add(L.stops[i + 1]);
      if(a === undefined || b === undefined || a === b) continue;
      const len = Math.hypot(G.x[a] - G.x[b], G.z[a] - G.z[b]);
      G.metro.push([a, b, L.c | 0, state.lines.indexOf(L)]);
      G.adj[a].push({to:b, len, kind:'subway'});
      G.adj[b].push({to:a, len, kind:'subway'});
    }
  }
  PATHS.clear();
}

/* --- A* over the lattice, with a path cache (the grid is far too big for
       all-pairs preprocessing, but origins/destinations repeat constantly) --- */
const PATHS = new Map();
let _g = new Float64Array(NN), _f = new Float64Array(NN);
let _came = new Int32Array(NN), _seen = new Uint8Array(NN);
let _heap = new Int32Array(NN * 6 + 4);
let _hn = 0;
function hpush(n){
  if(_hn >= _heap.length - 2) return;
  let i = ++_hn; _heap[i] = n;
  while(i > 1){ const p = i >> 1;
    if(_f[_heap[p]] <= _f[_heap[i]]) break;
    const t = _heap[p]; _heap[p] = _heap[i]; _heap[i] = t; i = p; }
}
function hpop(){
  const top = _heap[1]; _heap[1] = _heap[_hn--];
  let i = 1;
  for(;;){
    const l = i << 1, r = l + 1; let m = i;
    if(l <= _hn && _f[_heap[l]] < _f[_heap[m]]) m = l;
    if(r <= _hn && _f[_heap[r]] < _f[_heap[m]]) m = r;
    if(m === i) break;
    const t = _heap[m]; _heap[m] = _heap[i]; _heap[i] = t; i = m;
  }
  return top;
}
const MAX_SPEED = {walk:1, bike:2.4, transit:9};
function aStar(mode, from, to){
  const sp = MODE_SPEED[mode], ms = MAX_SPEED[mode];
  const h = n => Math.hypot(G.x[n] - G.x[to], G.z[n] - G.z[to]) / ms;
  _seen.fill(0); _hn = 0;
  _g[from] = 0; _f[from] = h(from); _came[from] = -1; _seen[from] = 1;
  hpush(from);
  let guard = 0;
  while(_hn > 0 && guard++ < 40000){
    const u = hpop();
    if(_seen[u] === 2) continue;
    _seen[u] = 2;
    if(u === to) break;
    const adj = G.adj[u];
    for(let i = 0; i < adj.length; i++){
      const e = adj[i], v = e.to;
      if(_seen[v] === 2) continue;
      const ng = _g[u] + e.len / (sp[e.kind] || 1);
      if(_seen[v] === 0 || ng < _g[v]){
        _g[v] = ng; _came[v] = u; _seen[v] = 1;
        _f[v] = ng + h(v);
        hpush(v);
      }
    }
  }
  if(_seen[to] !== 2) return null;
  const out = [];
  let c = to, gg = 0;
  while(c !== -1 && gg++ < 600){ out.push(c); c = _came[c]; }
  out.reverse();
  return out;
}
function routeNodes(mode, from, to){
  if(from < 0 || to < 0) return null;
  if(from === to) return [from];
  const key = mode.charCodeAt(0) + ':' + from + ':' + to;
  let p = PATHS.get(key);
  if(p !== undefined) return p;
  p = aStar(mode, from, to);
  if(PATHS.size > 40000) PATHS.clear();
  PATHS.set(key, p);
  return p;
}
function edgeKind(a, b){
  for(const e of G.adj[a]) if(e.to === b) return e.kind;
  return 'walk';
}

/* ============================================================================
   9.  AGENTS
   ========================================================================== */

const agentGeo = mergeGeometries([
  new THREE.CylinderGeometry(0.30, 0.24, 1.05, 6).translate(0, 1.15, 0),
  new THREE.SphereGeometry(0.27, 6, 5).translate(0, 1.88, 0),
  new THREE.BoxGeometry(0.46, 0.62, 0.34).translate(0, 0.33, 0),
], false);
const matAgent = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.85, flatShading:true});
const AGENT_SCALE = 2.0;

const CLOTHES = [0xef6f5a, 0x4fa3d1, 0xf0c04a, 0x7ec06a, 0xe07fb0, 0x8a7ee0, 0xf59f4a,
                 0x50c6b0, 0xe8e0d0, 0x6d7f96, 0xd4553f, 0x3f8f77];

let agentMesh = null;
const agents = [];
let homes = [], works = [], leisures = [], fields = [];
let outsideCount = 0;

function anchorsFor(o){
  if(o.type === 'sports'){ o._cap = 5 + (o.seed % 6); o._vis = 0; }
  const c = objCentre(o);
  const n = nearestNode(c.x, c.z);
  o._cx = c.x; o._cz = c.z; o._w = c.w * CELL; o._d = c.d * CELL;
  o._node = n;
  if(n < 0){ o._ex = c.x; o._ez = c.z; return; }
  const dx = G.x[n] - c.x, dz = G.z[n] - c.z, L = Math.hypot(dx, dz) || 1;
  o._ex = c.x + dx / L * (c.w * CELL / 2 + 2.2);
  o._ez = c.z + dz / L * (c.d * CELL / 2 + 2.2);
}

function weightedPicker(list, weights){
  const cum = []; let s = 0;
  for(let i = 0; i < list.length; i++){ s += weights[i]; cum.push(s); }
  return () => {
    if(!list.length) return null;
    const r = rnd() * s;
    let lo = 0, hi = cum.length - 1;
    while(lo < hi){ const m = (lo + hi) >> 1; if(cum[m] < r) lo = m + 1; else hi = m; }
    return list[lo];
  };
}

function initAgent(a, pickHome, pickWork){
  a.home = pickHome();
  a.noJob = rnd() < 0.20 || !works.length;
  a.work = a.noJob ? null : pickWork();
  if(!a.work) a.noJob = true;
  a.leis = null;
  if(leisures.length){
    let best = null, bd = Infinity;
    for(let k = 0; k < 5; k++){
      const cand = leisures[Math.floor(rnd() * leisures.length)];
      if(!cand) continue;
      const ref = a.home || a.work;
      const d = ref ? (cand._cx - ref._cx) ** 2 + (cand._cz - ref._cz) ** 2 : rnd();
      if(d < bd){ bd = d; best = cand; }
    }
    a.leis = best;
  }
  a.sporty = rnd() < 0.5;
  a.sportAt = 0; a.sportField = null; a.sportUntil = 0; a.sportDay = -1; a.sportSpot = null;
  a.tWork = 6.2 + rnd() * 2.5;
  a.tLunch = 11.9 + rnd() * 1.0;
  a.lunchLen = 0.7 + rnd() * 0.7;
  a.lunch = rnd() < 0.62;
  a.tHome = 16.7 + rnd() * 2.1;
  a.eve = rnd() < 0.55;
  a.tEve = a.tHome + 0.5 + rnd() * 1.6;
  a.tEveEnd = 20.6 + rnd() * 2.4;
  a.morningOut = rnd() < 0.5;
  a.sportAt = a.noJob ? 9.5 + rnd() * 6.5 : 17.2 + rnd() * 3.0;
  a.off = (rnd() - 0.5) * 4.6;
  a.spd = 0.82 + rnd() * 0.42;
  a.state = 'in';
  a.at = a.home;
  a.dest = a.home;
  a.path = null;
  a.x = a.home ? a.home._ex : 0; a.z = a.home ? a.home._ez : 0; a.y = 0;
  a.hx = 1; a.hz = 0;
  a.mill = 0; a.wait = 0;
  a.hidden = true;
  a.color = CLOTHES[Math.floor(rnd() * CLOTHES.length)];
}

function refreshAgents(){
  for(const o of state.objects) anchorsFor(o);
  homes = state.objects.filter(o => capacityOf(o).res > 0 && o._node >= 0);
  works = state.objects.filter(o => capacityOf(o).jobs > 0 && o._node >= 0);
  leisures = state.objects.filter(o => {
    const T = TYPES[o.type];
    return (T.kind === 'green' || T.kind === 'landmark' || T.leisure) && o.type !== 'sports' && o._node >= 0;
  });
  fields = state.objects.filter(o => o.type === 'sports' && o._node >= 0);
  const alive = new Set(state.objects);

  const want = state.population > 0 && homes.length
    ? clamp(Math.round(state.population / 62), 24, MAX_AGENTS) : 0;

  const pickHome = weightedPicker(homes, homes.map(o => capacityOf(o).res));
  const pickWork = weightedPicker(works, works.map(o => capacityOf(o).jobs));

  rng = mulberry32(state.seed * 31 + 991);
  while(agents.length > want) agents.pop();
  while(agents.length < want){
    const a = {};
    initAgent(a, pickHome, pickWork);
    agents.push(a);
  }
  const nearestField = ref => {
    if(!fields.length || !ref) return null;
    let best = null, bd = Infinity;
    for(const f of fields){
      const dd = (f._cx - ref._cx) ** 2 + (f._cz - ref._cz) ** 2;
      if(dd < bd){ bd = dd; best = f; }
    }
    return best;
  };
  for(const a of agents){
    if(a.sportField && !alive.has(a.sportField)){ a.sportField = null; a.sportUntil = 0; }
    if(a.sportField) a.sportField._vis = (a.sportField._vis || 0) + 1;
    if(!a.sportSpot || !alive.has(a.sportSpot)) a.sportSpot = nearestField(a.home || a.work);
    let bad = false;
    if(!a.home || !alive.has(a.home)) { a.home = pickHome(); bad = true; }
    if(a.work && !alive.has(a.work)) { a.work = works.length ? pickWork() : null; a.noJob = !a.work; bad = true; }
    if(a.leis && !alive.has(a.leis)) { a.leis = leisures.length ? leisures[Math.floor(rnd()*leisures.length)] : null; bad = true; }
    if(!a.leis && leisures.length) a.leis = leisures[Math.floor(rnd()*leisures.length)];
    if(bad || !a.at || !alive.has(a.at)){
      a.at = a.home; a.dest = a.home; a.state = 'in'; a.path = null; a.hidden = true;
      if(a.home){ a.x = a.home._ex; a.z = a.home._ez; }
    }
  }
  if(!agentMesh || agentMesh.count < agents.length){
    if(agentMesh){ scene.remove(agentMesh); agentMesh.dispose(); }
    agentMesh = new THREE.InstancedMesh(agentGeo, matAgent, Math.max(1, MAX_AGENTS));
    agentMesh.frustumCulled = false;
    agentMesh.castShadow = false;
    agentMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(agentMesh);
  }
  if(agentMesh){
    const c = new THREE.Color();
    for(let i = 0; i < agents.length; i++){ c.set(agents[i].color); agentMesh.setColorAt(i, c); }
    if(agentMesh.instanceColor) agentMesh.instanceColor.needsUpdate = true;
  }
  buildTramVehicles();
}

function targetFor(a, place){
  if(place === 'sport') return a.sportField || a.home;
  if(place === 'work') return a.work || a.home;
  if(place === 'leisure') return a.leis || a.home;
  return a.home;
}
function desiredPlace(a, h){
  if(a.sportField) return 'sport';
  if(a.noJob){
    if(h < a.tWork || h >= a.tEveEnd) return 'home';
    if(h < a.tLunch) return a.morningOut ? 'leisure' : 'home';
    if(h < a.tLunch + 1.3) return 'leisure';
    if(h < a.tHome) return 'home';
    if(a.eve && h >= a.tEve) return 'leisure';
    return 'home';
  }
  if(h < a.tWork || h >= a.tEveEnd) return 'home';
  if(h < a.tLunch) return 'work';
  if(a.lunch && h < a.tLunch + a.lunchLen) return 'leisure';
  if(h < a.tHome) return 'work';
  if(a.eve && h >= a.tEve) return 'leisure';
  return 'home';
}

function startTrip(a, dest, purpose){
  a.dest = dest;
  a.purpose = purpose || 'home';
  if(!dest){ a.state = 'in'; a.hidden = true; return; }
  const sx = a.state === 'in' && a.at ? a.at._ex : a.x;
  const sz = a.state === 'in' && a.at ? a.at._ez : a.z;
  const d = Math.hypot(dest._ex - sx, dest._ez - sz);
  if(d < 6){ a.state = 'in'; a.at = dest; a.hidden = true; return; }
  const mode = d < 95 ? 'walk' : d < 280 ? 'bike' : 'transit';
  const fromN = a.state === 'in' && a.at ? a.at._node : nearestNode(sx, sz);
  const toN = dest._node;
  const px = [sx], pz = [sz], pk = [];
  const nodes = routeNodes(mode, fromN, toN);
  if(nodes && nodes.length){
    for(let i = 0; i < nodes.length; i++){
      const n = nodes[i];
      px.push(G.x[n]); pz.push(G.z[n]);
      pk.push(i === 0 ? 'walk' : edgeKind(nodes[i-1], n));
    }
  }
  px.push(dest._ex); pz.push(dest._ez);
  pk.push('walk');
  a.px = px; a.pz = pz; a.pk = pk;
  a.seg = 0; a.t = 0;
  a.state = 'go';
  a.hidden = false;
  a.mode = mode;
}

const AGENT_BASE = 8.4;
function updateAgents(dt, hour, boost){
  outsideCount = 0;
  const simNow = state.simTime, dayNow = Math.floor(simNow / 24);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pv = new THREE.Vector3(), sv = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  const n = agents.length;
  for(let i = 0; i < n; i++){
    const a = agents[i];
    // a spell at the local sports field: capped headcount, about an hour long
    if(a.sportField){
      if(simNow >= a.sportUntil || a.sportUntil - simNow > 4){
        a.sportField._vis = Math.max(0, (a.sportField._vis || 0) - 1);
        a.sportField = null;
      }
    } else if(a.sporty && a.sportDay !== dayNow && hour >= a.sportAt && hour < a.sportAt + 0.7){
      a.sportDay = dayNow;
      const f = a.sportSpot;
      if(f && (f._vis || 0) < (f._cap || 6)){
        f._vis = (f._vis || 0) + 1;
        a.sportField = f;
        a.sportUntil = simNow + 0.85 + rnd() * 0.45;
      }
    }
    const place = desiredPlace(a, hour);
    const want = targetFor(a, place);
    if(want !== a.dest) startTrip(a, want, place);

    if(a.state === 'go' && a.px){
      let move = AGENT_BASE * a.spd * boost * dt;
      let guard = 0;
      while(move > 0 && a.seg < a.px.length - 1 && guard++ < 40){
        const x0 = a.px[a.seg], z0 = a.pz[a.seg];
        const x1 = a.px[a.seg + 1], z1 = a.pz[a.seg + 1];
        const len = Math.hypot(x1 - x0, z1 - z0) || 0.001;
        const kind = a.pk[a.seg] || 'walk';
        const sp = SEG_VIS_SPEED[kind];
        const step = move * sp / len;
        a.t += step;
        if(a.t >= 1){ move = (a.t - 1) * len / sp; a.t = 0; a.seg++; }
        else move = 0;
      }
      if(a.seg >= a.px.length - 1){
        const outdoorsy = a.dest && (a.purpose === 'leisure' || a.purpose === 'sport') &&
              (TYPES[a.dest.type].kind === 'green' || TYPES[a.dest.type].kind === 'landmark');
        a.state = outdoorsy ? 'mill' : 'in';
        a.at = a.dest;
        a.hidden = a.state === 'in';
        a.x = a.dest._ex; a.z = a.dest._ez;
        if(a.state === 'mill'){ a.mx = a.x; a.mz = a.z; a.wait = 0; }
      } else {
        const x0 = a.px[a.seg], z0 = a.pz[a.seg];
        const x1 = a.px[a.seg + 1], z1 = a.pz[a.seg + 1];
        const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz) || 1;
        const kind = a.pk[a.seg] || 'walk';
        a.hidden = (kind === 'subway');
        a.hx = dx / L; a.hz = dz / L;
        a.x = x0 + dx * a.t - a.hz * a.off * 0.6;
        a.z = z0 + dz * a.t + a.hx * a.off * 0.6;
      }
    } else if(a.state === 'mill'){
      a.hidden = false;
      a.wait -= dt;
      const dx = a.mx - a.x, dz = a.mz - a.z, L = Math.hypot(dx, dz);
      if(L < 1.2 || a.wait < -6){
        if(a.wait > 0){ /* pausing */ }
        else {
          const o = a.at || a.dest;
          if(o){
            a.mx = o._cx + (rnd() - 0.5) * o._w * 0.82;
            a.mz = o._cz + (rnd() - 0.5) * o._d * 0.82;
          }
          a.wait = 1.5 + rnd() * 6;
        }
      } else {
        const sp = AGENT_BASE * 0.30 * a.spd * boost * dt;
        a.hx = dx / L; a.hz = dz / L;
        a.x += a.hx * sp; a.z += a.hz * sp;
      }
    }

    if(a.hidden || a.state === 'in'){
      m.makeScale(0.0001, 0.0001, 0.0001);
      m.setPosition(0, -500, 0);
    } else {
      outsideCount++;
      const bob = a.state === 'go' ? Math.sin((perfNow * 0.009 + i) * 1.6) * 0.06 : 0;
      pv.set(a.x, terrainGuessY(a.x, a.z) + bob, a.z);
      q.setFromAxisAngle(up, Math.atan2(a.hx, a.hz));
      sv.set(AGENT_SCALE, AGENT_SCALE, AGENT_SCALE);
      m.compose(pv, q, sv);
    }
    if(agentMesh) agentMesh.setMatrixAt(i, m);
  }
  if(agentMesh){
    agentMesh.count = n;
    agentMesh.instanceMatrix.needsUpdate = true;
  }
  $('outside').textContent = fmtN(Math.round(outsideCount * (state.population > 0 && agents.length ? state.population / agents.length : 0)));
}
function terrainGuessY(x, z){ return Math.max(0, terrainH(x, z)) * 0.0 + 0.15; }

/* --- trams ---------------------------------------------------------------- */
const tramGeo = mergeGeometries([
  new THREE.BoxGeometry(21, 2.6, 3.1).translate(0, 2.1, 0),
  new THREE.BoxGeometry(19.4, 0.5, 3.3).translate(0, 3.5, 0),
  new THREE.BoxGeometry(21.4, 0.5, 3.4).translate(0, 1.25, 0),
], false);
const matTram = new THREE.MeshStandardMaterial({color:0xe8e2d6, roughness:0.6, metalness:0.15,
  emissive:0xffcf94, emissiveIntensity:0.0});
let tramMesh = null;
const trams = [];

function buildTramVehicles(){
  trams.length = 0;
  for(const path of (G.tramPaths || [])){
    const pts = path.pts;
    if(!pts || pts.length < 2) continue;
    const count = clamp(Math.floor(pts.length / 3), 1, 4);
    for(let i = 0; i < count; i++)
      trams.push({pts, t: (i + 0.4) / count * (pts.length - 1), dir: i % 2 ? -1 : 1,
                  ox:0, oz:0, wait:0});
  }
  if(trams.length){ makeTramMesh(); return; }
  const corridors = [];
  const seen = new Set();
  for(let a = 0; a < NN; a++){
    if(!G.ok[a]) continue;
    for(const e of G.adj[a]){
      if(e.kind !== 'tram') continue;
      const key = Math.min(a, e.to) + '-' + Math.max(a, e.to);
      if(seen.has(key)) continue;
      seen.add(key);
      corridors.push([a, e.to]);
    }
  }
  // merge collinear edges into runs
  const runs = [];
  const used = new Set();
  for(const [a, b] of corridors){
    const key = Math.min(a,b) + '-' + Math.max(a,b);
    if(used.has(key)) continue;
    const horiz = Math.abs(G.x[a] - G.x[b]) > Math.abs(G.z[a] - G.z[b]);
    let run = [a, b];
    used.add(key);
    let ext = true;
    while(ext){
      ext = false;
      for(const end of [0, 1]){
        const node = end ? run[run.length - 1] : run[0];
        for(const e of G.adj[node]){
          if(e.kind !== 'tram') continue;
          const k2 = Math.min(node, e.to) + '-' + Math.max(node, e.to);
          if(used.has(k2)) continue;
          const h2 = Math.abs(G.x[node] - G.x[e.to]) > Math.abs(G.z[node] - G.z[e.to]);
          if(h2 !== horiz) continue;
          used.add(k2);
          if(end) run.push(e.to); else run.unshift(e.to);
          ext = true;
        }
      }
    }
    runs.push(run);
  }
  for(const run of runs){
    if(run.length < 2) continue;
    const count = clamp(Math.floor(run.length / 2), 1, 3);
    for(let i = 0; i < count; i++){
      trams.push({pts: run.map(n => ({x:G.x[n], z:G.z[n], stop:false})),
                  t: (i + 0.35) / count * (run.length - 1), dir: i % 2 ? -1 : 1, ox:0, oz:0, wait:0});
    }
    if(trams.length > 40) break;
  }
  makeTramMesh();
}
function makeTramMesh(){
  if(tramMesh){ scene.remove(tramMesh); tramMesh.dispose(); tramMesh = null; }
  if(!trams.length) return;
  tramMesh = new THREE.InstancedMesh(tramGeo, matTram, trams.length);
  tramMesh.frustumCulled = false;
  tramMesh.castShadow = true;
  tramMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(tramMesh);
}
function updateTrams(dt, boost){
  if(!tramMesh) return;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(1,1,1);
  const up = new THREE.Vector3(0,1,0);
  for(let i = 0; i < trams.length; i++){
    const tr = trams[i];
    const pts = tr.pts;
    if(!pts || pts.length < 2) continue;
    const segCount = pts.length - 1;
    if(tr.wait > 0){
      tr.wait -= dt * Math.max(boost, 0.001);
    } else {
      const sIdx = clamp(Math.floor(tr.t), 0, segCount - 1);
      const a0 = pts[sIdx], b0 = pts[sIdx + 1];
      const segLen = Math.hypot(b0.x - a0.x, b0.z - a0.z) || 1;
      const oldT = tr.t;
      tr.t += tr.dir * (32 * boost * dt) / segLen;
      if(tr.dir > 0){
        const k = Math.ceil(oldT + 1e-4);
        if(k <= segCount && tr.t >= k && pts[k] && pts[k].stop){ tr.t = k; tr.wait = 1.8 + Math.random() * 1.4; }
      } else {
        const k = Math.floor(oldT - 1e-4);
        if(k >= 0 && tr.t <= k && pts[k] && pts[k].stop){ tr.t = k; tr.wait = 1.8 + Math.random() * 1.4; }
      }
      if(tr.t >= segCount){ tr.t = segCount; tr.dir = -1; tr.wait = 2.6 + Math.random() * 1.6; }
      if(tr.t <= 0){ tr.t = 0; tr.dir = 1; tr.wait = 2.6 + Math.random() * 1.6; }
    }
    const seg = clamp(Math.floor(tr.t), 0, segCount - 1);
    const f = clamp(tr.t - seg, 0, 1);
    const a = pts[seg], b = pts[seg + 1];
    const x = lerp(a.x, b.x, f), z = lerp(a.z, b.z, f);
    let dxn = b.x - a.x, dzn = b.z - a.z;
    const dl = Math.hypot(dxn, dzn) || 1; dxn /= dl; dzn /= dl;
    const tx = dzn * TRAM_LAT * tr.dir, tz = -dxn * TRAM_LAT * tr.dir;
    const k2 = 1 - Math.pow(0.02, dt);
    tr.ox += (tx - tr.ox) * k2; tr.oz += (tz - tr.oz) * k2;
    const ang = Math.atan2(dxn, dzn);
    p.set(x + tr.ox, 0.3, z + tr.oz);
    q.setFromAxisAngle(up, ang + Math.PI / 2);
    m.compose(p, q, s);
    tramMesh.setMatrixAt(i, m);
  }
  tramMesh.instanceMatrix.needsUpdate = true;
}

function updateBand(pt){

let hoverIdx = -1, dragOffX = 0, dragOffZ = 0, downPos = null, action = null;
let ghostGX = 0, ghostGZ = 0, ghostRot = 0, ghostValid = false;

function setGhostFor(spec, gx, gz, rot, valid){
  const [w0, d0, type] = tdims(spec);
  const T = TYPES[type];
  const r = rot & 3;
  const w = ((r % 2) ? d0 : w0) * CELL, d = ((r % 2) ? w0 : d0) * CELL;
  const st = (typeof spec === 'object' && spec.stories) || T.stories || 0;
  const h = st ? st * STORY : 3;
  const cx = wx(gx) - CELL/2 + w/2, cz = wz(gz) - CELL/2 + d/2;
  ghost.scale.set(w - 0.6, h, d - 0.6);
  ghost.position.set(cx, h / 2, cz);
  ghost.material.color.setHex(valid ? 0x6fd6c2 : 0xff6b5e);
  ghostEdge.material.color.setHex(valid ? 0xa8fff0 : 0xffb0a8);
  ghost.visible = true;
}
function updateSelectionBox(){
  const o = state.objects[state.selected];
  if(!o || state.mode !== 'edit'){ selBox.visible = false; return; }
  const c = objCentre(o), h = objHeight(o);
  selBox.scale.set(c.w * CELL - 0.3, h, c.d * CELL - 0.3);
  selBox.position.set(c.x, h / 2, c.z);
  selBox.visible = true;
}

function pointerNDC(e){
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
}
function groundAt(e){
  pointerNDC(e);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(groundPlane, hitPt) ? hitPt.clone() : null;
}
function pickObject(e){
  if(!pickMesh) return -1;
  pointerNDC(e);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(pickMesh, false);
  for(const h of hits){
    const id = h.instanceId;
    if(id === undefined || id >= state.objects.length) continue;
    // in transit view only the network is clickable
    if(state.metro && TYPES[state.objects[id].type].kind !== 'transit') continue;
    return id;
  }
  return -1;
}

function describe(o){
  const T = TYPES[o.type], c = capacityOf(o);
  const f = footprint(o);
  const bits = [];
  if(o.stories || T.stories) bits.push(storiesOf(o) + ' storeys');
  bits.push((f.w * CELL) + '×' + (f.d * CELL) + ' m');
  if(hasStyle(o.type)) bits.push(STYLES[clamp(o.style | 0, 0, 4)]);
  if(o.type === 'sports' || o.type === 'stadium') bits.push(SPORTS[clamp(o.sport | 0, 0, 2)]);
  if(o.lvl) bits.push('on a roof');
  if(o.type === 'subway'){
    const on = lineOfStation(o.uid);
    bits.push(on.length ? 'Line ' + on.map(i => i + 1).join(', ') : 'not on a line yet');
  }
  if(c.res) bits.push(fmtN(c.res) + ' residents');
  if(c.jobs) bits.push(fmtN(c.jobs) + ' jobs');
  if(T.kind === 'green') bits.push('open space');
  if(T.kind === 'transit') bits.push('network');
  return '<b>' + T.label + '</b><br>' + bits.join(' · ');
}

canvas.addEventListener('pointermove', e => {
  if(action === 'orbit'){
    camGoal.az += e.movementX * 0.005;
    camGoal.el = clamp(camGoal.el - e.movementY * 0.004, 0.10, 1.45);
    return;
  }
  if(action === 'pan'){
    const k = cam.dist * 0.0018;
    const ca = Math.cos(cam.az), sa = Math.sin(cam.az);
    camGoal.target.x += (-ca * e.movementY - sa * e.movementX) * k;
    camGoal.target.z += (-sa * e.movementY + ca * e.movementX) * k;
    camGoal.target.x = clamp(camGoal.target.x, -WORLD, WORLD);
    camGoal.target.z = clamp(camGoal.target.z, -WORLD, WORLD);
    return;
  }
  const tip = $('tip');
  if(state.mode === 'edit' && isLineTool()){
    const g = groundAt(e);

    band.material.color.setHex(snapStop ? 0xa8ffe6 : 0x6f8b9a);

      tip.style.top = (e.clientY + 16) + 'px';
    } else tip.style.display = 'none';
    return;
  }
  if(action === 'drag' && state.selected >= 0){
    const g = groundAt(e);
    if(g){
      const [cx, cz] = cellFromWorld(g.x, g.z);
      const o = state.objects[state.selected];
      const spot = resolvePlacement(o, cx - dragOffX, cz - dragOffZ, ghostRot);
      ghostValid = !!spot;
      if(spot){ ghostGX = spot[0]; ghostGZ = spot[1]; }
      setGhostFor(o, ghostGX, ghostGZ, ghostRot, ghostValid);
    }
    tip.style.display = 'none';
    return;
  }
  if(state.mode === 'edit' && state.tool){
    const g = groundAt(e);
    if(g){
      const [cx, cz] = cellFromWorld(g.x, g.z);
      const sp = toolSpec(state.tool);
      if(!sp) return;
      const spot = resolvePlacement(sp, cx, cz, ghostRot);
      ghostValid = !!spot;
      if(spot){ ghostGX = spot[0]; ghostGZ = spot[1]; }
      else { ghostGX = cx; ghostGZ = cz; }
      setGhostFor(sp, ghostGX, ghostGZ, ghostRot, ghostValid);
    }
    tip.style.display = 'none';
    return;
  }
  ghost.visible = false;
  hoverIdx = pickObject(e);
  if(hoverIdx >= 0){
    tip.innerHTML = describe(state.objects[hoverIdx]);
    tip.style.display = 'block';
    tip.style.left = Math.min(innerWidth - 240, e.clientX + 16) + 'px';
    tip.style.top = (e.clientY + 16) + 'px';

  if(action === 'orbit' && still && state.mode === 'edit' && !state.tool && e.button === 0){

    const o = state.objects[state.selected];
    if(moved && ghostValid && (o.gx !== ghostGX || o.gz !== ghostGZ || o.rot !== ghostRot)){
      const dx = ghostGX - o.gx, dz = ghostGZ - o.gz;
      const riders = TYPES[o.type].hosts ? withRiders([state.selected]).filter(i => i !== state.selected) : [];
      const lay = layerFor(o, ghostGX, ghostGZ, ghostRot);
      const under = occupantsUnder(o, ghostGX, ghostGZ, ghostRot, state.selected, lay.lvl);
      o.gx = ghostGX; o.gz = ghostGZ; o.rot = ghostRot; o.lvl = lay.lvl;
      for(const ri of riders){ const r = state.objects[ri]; if(r){ r.gx += dx; r.gz += dz; } }

let snapStop = null;
function lineClick(e){
  const g = groundAt(e);
  if(!g) return;
  const st = stopNear(g.x, g.z, STOP_TYPE[lineMode()]);
  if(!st){
    toast(lineMode() === 'tram' ? 'Place tram stops first, then link them'
                                : 'Place subway stops first, then link them');
    return;
  }
  addStopToLine(st);
}
/* The nearest stop of this kind to a point on the ground, if it is close enough to snap to. */
function stopNear(wxp, wzp, type, radius){
  const r = radius || 24;
  let best = null, bd = r * r;
  for(const o of state.objects){
    if(o.type !== type) continue;
    const dx = wx(o.gx) - wxp, dz = wz(o.gz) - wzp;
    const d = dx * dx + dz * dz;
    if(d < bd){ bd = d; best = o; }
  }
  return best;
}
function addStopToLine(st, mode){
  if(!st) return;
  const m = mode || lineMode();
  if(drawLine < 0 || !state.lines[drawLine] || modeOf(state.lines[drawLine]) !== m){
    state.lines.push({mode:m, c: state.lines.filter(L => modeOf(L) === m).length % METRO_COLS.length, stops: []});
    drawLine = state.lines.length - 1;
  }
  const L = state.lines[drawLine];
  if(L.stops[L.stops.length - 1] === st.uid) return;
  L.stops.push(st.uid);
  rebuildCity();
  buildInspector(true);
}
function addStopAt(wxp, wzp, mode){          // used by tests and Auto-connect
  const m = mode || lineMode();
  addStopToLine(stopNear(wxp, wzp, STOP_TYPE[m], 40), m);
}
function finishLine(){
  if(drawLine >= 0 && state.lines[drawLine] && state.lines[drawLine].stops.length < 2)
    state.lines.splice(drawLine, 1);
  drawLine = -1;
  band.visible = false;
  snapRing.visible = false;
  rebuildCity();
  buildInspector(true);
}

const axisRot = (gx, gz) => (cellAxis(gx, gz) === 'z' ? 1 : 0);
function tryPlace(){
  if(!state.tool) return;
  const sp = toolSpec(state.tool);
  const spot = resolvePlacement(sp, ghostGX, ghostGZ, ghostRot);
  if(!spot){
    const off = ghostGX < 2 || ghostGZ < 2 || ghostGX > GRID - 3 || ghostGZ > GRID - 3;
    toast(off ? 'That’s past the edge of the map'
        : state.tool === 'prom' ? 'Promenades follow the shoreline'
        : 'That can’t go on the water');
    return;
  }
  const [gx, gz] = spot;
  // stops face their street unless I have deliberately turned them
  const rot = (!ghostRot && (state.tool === 'tramstop' || state.tool === 'subway'))
            ? axisRot(gx, gz) : ghostRot;
  const lay = layerFor(sp, gx, gz, rot);
  const under = occupantsUnder(sp, gx, gz, rot, -1, lay.lvl);
  if(under.length) removeMany(under);
  addObject(sp, gx, gz, rot, lay.lvl);
  if(lay.lvl) toast('Placed on the ' + TYPES[lay.host.type].label.toLowerCase());
  state.selected = -1;
  queueRebuild();
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  keys.add(k);
  if(k === 'escape' && $('modal').classList.contains('show')){ closeNewDialog(); return; }
  if((k === 'enter' || k === 'escape') && drawLine >= 0){ finishLine(); if(k === 'enter') return; }
  if(k === 'escape'){ setTool(null); state.selected = -1; updateSelectionBox(); buildInspector(true); ghost.visible = false; }
  if(k === 'f'){ resetCamera(); }
  if(k === 'm'){ setMetroView(!state.metro); }
  if(k === 'r'){
    if(state.mode === 'edit' && (state.tool || state.selected >= 0)){
      ghostRot = (ghostRot + 1) & 3;
      if(state.tool){ const sp = toolSpec(state.tool);
        ghostValid = canPlace(sp, ghostGX, ghostGZ, ghostRot, -1); setGhostFor(sp, ghostGX, ghostGZ, ghostRot, ghostValid); }
      else if(state.selected >= 0){
        const o = state.objects[state.selected];
        if(fits(o, o.gx, o.gz, ghostRot)){
          const under = occupantsUnder(o, o.gx, o.gz, ghostRot, state.selected, o.lvl);
          o.rot = ghostRot;
          if(under.length){ const keep = o; removeMany(under); state.selected = state.objects.indexOf(keep); }
          else reindexOcc();
          queueRebuild();
        } else toast('No room to rotate');
      }
    } else resetCamera();
  }
  if((k === 'delete' || k === 'backspace') && state.mode === 'edit' && state.selLine >= 0){
    state.lines.splice(state.selLine, 1);
    state.selLine = -1;
    rebuildCity();
    buildInspector(true);
    toast('Line removed');
    return;
  }
  if((k === 'delete' || k === 'backspace') && state.mode === 'edit' && state.selected >= 0){
    removeObject(state.selected);
    state.selected = -1;
    queueRebuild();
    toast('Removed');
  }
  if(k === ' '){ e.preventDefault(); setSpeed(state.speed === 0 ? 1 : 0); }
  if(k === 'tab'){ e.preventDefault(); setMode(state.mode === 'view' ? 'edit' : 'view'); }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

function updateCameraInput(dt){
  const sp = (keys.has('shift') ? 2.2 : 1) * cam.dist * 0.85 * dt;
  let fx = 0, fz = 0;
  if(keys.has('w') || keys.has('arrowup')) fz += 1;
  if(keys.has('s') || keys.has('arrowdown')) fz -= 1;
  if(keys.has('a') || keys.has('arrowleft')) fx -= 1;
  if(keys.has('d') || keys.has('arrowright')) fx += 1;
  if(keys.has('q')) camGoal.az -= dt * 1.1;
  if(keys.has('e')) camGoal.az += dt * 1.1;
  if(fx || fz){
    const ca = Math.cos(camGoal.az), sa = Math.sin(camGoal.az);
    camGoal.target.x += (-ca * fz - (-sa) * fx) * sp;
    camGoal.target.z += (-sa * fz - (ca) * fx) * sp;
    camGoal.target.x = clamp(camGoal.target.x, -WORLD, WORLD);
    camGoal.target.z = clamp(camGoal.target.z, -WORLD, WORLD);
  }
  const k = 1 - Math.pow(0.0016, dt);
  cam.target.lerp(camGoal.target, k);
  cam.dist = lerp(cam.dist, camGoal.dist, k);
  cam.az = lerp(cam.az, camGoal.az, k);
  cam.el = lerp(cam.el, camGoal.el, k);
  applyCamera();
}

const matEdge = new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:0.5, depthWrite:false});
let edgeMesh = null;
function buildEdge(){
  if(edgeMesh){ scene.remove(edgeMesh); edgeMesh.geometry.dispose(); edgeMesh = null; }
  const B = newBatch(2048);
  const half = WORLD / 2;
  const rail = [0.60, 0.98, 0.92], post = [0.88, 1.0, 0.97];
  const step = 18;
  const yAt = (x, z) => Math.max(terrainH(x, z), SEA) + 0.45;
  for(let side = 0; side < 4; side++){
    const horiz = side < 2;
    for(let t = -half; t < half - 0.5; t += step){
      const a = t, b = Math.min(t + step, half);
      const mid = (a + b) / 2, len = (b - a) * 1.03;
      const mx = horiz ? mid : (side === 2 ? -half : half);
      const mz = horiz ? (side === 0 ? -half : half) : mid;
      const y = yAt(mx, mz);
      box(B, horiz ? len : 1.4, 0.45, horiz ? 1.4 : len, mx, y, mz, rail, 0);
      if(Math.round((mid + half) / step) % 5 === 0)
        box(B, 1.0, 3.4, 1.0, mx, y + 1.7, mz, post, 0);
    }
  }
  for(const [sx, sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    const x = sx * half, z = sz * half, y = yAt(x, z);
    box(B, 2.0, 15, 2.0, x, y + 7.5, z, post, 0);
    box(B, 6, 0.5, 6, x, y + 0.2, z, post, 0);
  }
  const parts = B.geo.slice();
  const bg = batchGeometry(B);
  if(bg) parts.unshift(bg);
  if(!parts.length) return;
  const g2 = parts.length === 1 ? parts[0] : mergeGeometries(parts, false);
  if(parts.length > 1) parts.forEach(x => x.dispose());
  if(!g2) return;
  edgeMesh = new THREE.Mesh(g2, matEdge);
  edgeMesh.frustumCulled = false;
  edgeMesh.matrixAutoUpdate = false;
  edgeMesh.renderOrder = 3;
  scene.add(edgeMesh);
}

function resizeWorld(g){
  g = clamp(g | 0, 60, 300);
  if(g === GRID) return;
  GRID = g; HALF = g / 2; WORLD = g * CELL;
  SHORE = Math.round(WORLD * 0.30);
  waterU.uShore.value = SHORE;
  occ = new Int32Array(GRID * GRID).fill(-1);
  occT = new Int32Array(GRID * GRID).fill(-1);
  NX = Math.floor((GRID - PITCH) / PITCH) + 1;
  NN = NX * NX;
  G.ok = new Uint8Array(NN);
  G.x = new Float32Array(NN); G.z = new Float32Array(NN);
  G.adj = []; G.stations = []; G.metro = [];
  _g = new Float64Array(NN); _f = new Float64Array(NN);
  _came = new Int32Array(NN); _seen = new Uint8Array(NN);
  _heap = new Int32Array(NN * 6 + 4);
  PATHS.clear();
  scene.remove(terrainMesh);
  terrainMesh.geometry.dispose();
  terrainMesh = buildTerrain();
  scene.add(terrainMesh);
  makeGridHelper();
  buildEdge();
}

function buildPalette(){

    html += '<div class="pgroup">' + cat + '</div><div class="pitems">';
    for(const k in TYPES){

      if(T.cat !== cat || T.legacy) continue;
      html += '<button class="pitem" data-t="' + k + '"><span class="sw" style="background:' + T.sw + '"></span>' + T.label + '</button>';
    }
    if(cat === 'Transit'){
      html += '<button class="pitem" data-t="tramline" style="grid-column:1/-1">' +
              '<span class="sw" style="background:linear-gradient(90deg,#f26a52,#ffc879)"></span>Draw Tram Line</button>';
      html += '<button class="pitem" data-t="subwayline" style="grid-column:1/-1">' +
              '<span class="sw" style="background:linear-gradient(90deg,#3d9bff,#4fd18a)"></span>Draw Subway Line</button>';
    }
    html += '</div>';
  }
  html += '<div class="phint"><kbd>click</kbd> place (replaces what is there) · <kbd>R</kbd> rotate · ' +
          '<kbd>drag</kbd> move · <kbd>Del</kbd> remove · <kbd>Esc</kbd> cancel<br>' +
          '<kbd>left-drag</kbd> orbit · <kbd>right-drag</kbd> pan · <kbd>WASD</kbd> move · <kbd>F</kbd> reset<br>' +
          '<kbd>M</kbd> metro map · malls carry towers · forests carry paths<br>' +
          'Lines: place stops, then click stop to stop to link them (<kbd>Enter</kbd> finishes)<br><br>' +
          '<button class="btn" id="btnClear" style="width:100%">Clear the city</button></div>';
  el.innerHTML = html;
  el.querySelectorAll('.pitem').forEach(b => {
    b.addEventListener('click', () => setTool(b.dataset.t === state.tool ? null : b.dataset.t));
  });
  $('btnClear').addEventListener('click', () => {
    state.objects.length = 0; occ.fill(-1); occT.fill(-1); state.selected = -1; setTool(null);
    queueRebuild(); toast('Cleared — build something');
  });
}
let metroAuto = false;
function setTool(t){
  if(drawLine >= 0 && t !== LINE_TOOL) finishLine();
  if(t && !isTransitTool(t) && state.metro){ metroAuto = false; setMetroView(false); }
  state.tool = t;
  band.visible = false;
  snapRing.visible = false;
  snapStop = null;
  if(isLineTool() && !state.metro){ metroAuto = true; setMetroView(true); }
  else if(!isLineTool() && metroAuto){ metroAuto = false; setMetroView(false); }
  if(metroMesh) metroMesh.visible = state.metro || isLineTool();
  document.querySelectorAll('.pitem').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if(!t) ghost.visible = false;
  if(t){ state.selected = -1; updateSelectionBox(); ghostRot = 0; }
  buildInspector(true);
}

function queueRebuildSoon(){

function inspectTarget(){

function applyProp(key, val){

  }
  if(key === 'w' || key === 'd'){
    const trial = {type:o.type, w: key === 'w' ? val : o.w, d: key === 'd' ? val : o.d};
    let gx = o.gx, gz = o.gz;
    if(!fits(trial, gx, gz, o.rot)){
      const spot = resolvePlacement(trial, gx, gz, o.rot);       // shuffle it into the block
      if(!spot){ toast('No room to resize here'); buildInspector(true); return; }
      gx = spot[0]; gz = spot[1];
    }
    const under = occupantsUnder(trial, gx, gz, o.rot, state.selected, o.lvl);
    o[key] = val; o.gx = gx; o.gz = gz;
    if(under.length){ const keep = o; removeMany(under); state.selected = state.objects.indexOf(keep); }
    else reindexOcc();

  queueRebuildSoon();

function applyCity(d){
  if(!d || !Array.isArray(d.objects)) throw new Error('bad file');

    const L = LEGACY[o.t];

      type, gx:o.x|0, gz:o.z|0, rot:(o.r|0)&3, uid:o.u | 0,

    camGoal.dist = d.camera.d; camGoal.az = d.camera.a; camGoal.el = d.camera.e;

   13.  CITY GENERATOR
   ========================================================================== */

function blankCity(seed){
  state.seed = (seed >>> 0) || 1;
  rng = mulberry32(state.seed);
  state.objects.length = 0;
  state.lines.length = 0;
  drawLine = -1;
  occ.fill(-1); occT.fill(-1);
  state.selected = -1;
  setTool(null);
  state.hour = 9; state.simTime = 9;
  rebuildCity();
  resetCamera(false);
  setMode('edit');
}
function blockLandFrac(bx, bz){
  const gx0 = bx * PITCH, gz0 = bz * PITCH, span = PITCH - 1;
  let ok = 0;
  for(let i = 0; i < span; i++) for(let j = 0; j < span; j++)
    if(validCell('apartments', gx0 + i, gz0 + j)) ok++;
  return ok / (span * span);
}
function placeInBlock(bx, bz, spec, rot){
  const gx0 = bx * PITCH, gz0 = bz * PITCH, span = PITCH - 1;
  const [w0, d0] = tdims(spec);
  const w = (rot % 2) ? d0 : w0, d = (rot % 2) ? w0 : d0;
  if(w > span || d > span) return false;
  const opts = [];
  for(let i = 0; i <= span - w; i++) for(let j = 0; j <= span - d; j++) opts.push([i, j]);
  for(let i = opts.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }
  for(const [i, j] of opts){
    if(canPlace(spec, gx0 + i, gz0 + j, rot, -1)){ addObject(spec, gx0 + i, gz0 + j, rot); return true; }
  }
  return false;
}
/* Recipes are ordered largest-first so towers claim space before infill. */
function fillBlock(bx, bz, recipe){
  let placed = 0;
  for(const spec of recipe){
    if(!spec) continue;
    const rot = rnd() < 0.5 ? 0 : 1;
    if(placeInBlock(bx, bz, spec, rot) || placeInBlock(bx, bz, spec, rot ^ 1)) placed++;
  }
  return placed;
}
function maybe(p, a, b){ return rnd() < p ? a : b; }
function placeLine(type, fixed, axis, from, to){
  let n = 0;
  for(let g = Math.max(1, from); g <= Math.min(GRID - 2, to); g++){
    const gx = axis === 'x' ? g : fixed, gz = axis === 'x' ? fixed : g;
    if(canPlace(type, gx, gz, 0, -1)){ addObject(type, gx, gz, 0); n++; }
  }
  return n;
}

/* --- zone recipes ---------------------------------------------------------
   Every entry is a full spec, so generated cities vary in height and footprint
   exactly the way a hand-edited one can. --------------------------------- */
function apts(scale){
  const opts = scale === 'huge' ? [[56,3,3],[64,3,3],[52,4,4],[64,4,4],[56,5,5],[72,3,3]]
             : scale === 'big'  ? [[32,3,3],[40,3,3],[48,3,3],[60,3,3],[44,4,4],[36,4,4]]
             : scale === 'mid'  ? [[16,2,2],[24,2,2],[24,3,3],[28,3,3],[32,3,3]]
             :                    [[6,2,2],[8,2,2],[12,2,2],[14,2,2],[12,3,3],[18,2,2]];
  const o = pick(opts);
  return {type:'apartments', stories:o[0], w:o[1], d:o[2], tint: pick(WARM_TINTS)};
}
/* Bigger cities build taller: the housing mix shifts with the chosen size. */
const TIERS = ['small','mid','big','huge'];
function hoodTier(drop){
  const s = state.size | 0, r = rnd();
  let i = s >= 3 ? (r < 0.40 ? 3 : r < 0.80 ? 2 : 1)
        : s === 2 ? (r < 0.22 ? 3 : r < 0.66 ? 2 : 1)
        : s === 1 ? (r < 0.35 ? 2 : r < 0.85 ? 1 : 0)
        :           (r < 0.2 ? 2 : r < 0.6 ? 1 : 0);
  i = clamp(i - (drop || 0), 0, 3);
  return TIERS[i];
}
function offices(scale){
  const opts = scale === 'tall' ? [[100,4,4],[120,4,4],[140,4,4],[160,4,4],[120,3,3]]
                                : [[40,3,3],[60,3,3],[80,3,3],[70,2,2],[90,3,3]];
  const o = pick(opts);
  return {type:'office', stories:o[0], w:o[1], d:o[2], tint: pick(COOL_TINTS)};
}
function hospitalS(){
  const o = pick([[16,4,3],[20,4,4],[24,4,3],[30,4,4],[36,4,4]]);
  return {type:'hospital', stories:o[0], w:o[1], d:o[2], tint: 4};
}
function schoolS(){ const o = pick([[4,4,3],[5,4,3],[5,4,4],[6,3,3],[8,4,4]]);
  return {type:'school', stories:o[0], w:o[1], d:o[2], tint: 1}; }
function libraryS(){ const o = pick([[4,3,3],[5,3,3],[6,2,2],[4,4,3]]);
  return {type:'library', stories:o[0], w:o[1], d:o[2], tint: 0}; }
function parkS(){ const o = pick([[2,2],[3,3],[3,3],[4,4],[4,3],[5,4]]);
  return {type:'park', w:o[0], d:o[1]}; }
function plazaS(){ const o = pick([[2,2],[2,2],[3,3],[3,2]]);
  return {type:'plaza', w:o[0], d:o[1]}; }
function sportsS(){ const o = pick([[4,3],[5,3],[5,4],[4,4]]);
  return {type:'sports', w:o[0], d:o[1]}; }

function recipeBiz(){
  const r = [offices(rnd() < 0.55 ? 'tall' : 'low')];
  if(r[0].w <= 3) r.push(maybe(0.5, plazaS(), offices('low')));
  else if(rnd() < 0.45) r.push(plazaS());
  return r;
}
function recipeBizGreen(){ return maybe(0.5, [parkS(), plazaS()], [sportsS(), plazaS()]); }
function recipeMixed(){
  const r = [pick([offices('low'), apts(hoodTier()), apts(hoodTier()), hospitalS(), hospitalS(), schoolS()])];
  r.push(pick([apts(hoodTier(1)), apts(hoodTier(1)), apts(hoodTier(2)), plazaS(), libraryS()]));
  if(rnd() < 0.45) r.push(pick([apts(hoodTier(2)), plazaS(), apts(hoodTier(1))]));
  return r;
}
/* Neighbourhoods: homes and the things that serve them. No office towers. */
function recipeHood(){
  const r = [pick([apts(hoodTier()), apts(hoodTier()), apts(hoodTier()), apts(hoodTier()),
                   apts(hoodTier()), schoolS(), libraryS(), parkS()])];
  r.push(pick([apts(hoodTier(1)), apts(hoodTier(1)), apts(hoodTier(2)), apts(hoodTier(1))]));
  r.push(pick([apts(hoodTier(2)), apts(hoodTier(1)), plazaS(), libraryS()]));
  if(rnd() < 0.45) r.push(pick([apts(hoodTier(2)), plazaS(), schoolS()]));
  return r;
}
function recipeGreen(){
  return rnd() < 0.45 ? [sportsS(), plazaS()] : [parkS(), maybe(0.5, plazaS(), parkS())];
}
function recipeShore(){
  const r = [pick([apts(hoodTier(1)), apts(hoodTier()), apts(hoodTier(2)), parkS(), sportsS()])];
  r.push(pick([apts(hoodTier(2)), plazaS(), 'prom']));
  return r;
}

function generateCity(seed, sizeIdx){
  state.seed = (seed >>> 0) || 1;
  state.size = clamp(sizeIdx === undefined ? (state.size === undefined ? 2 : state.size) : sizeIdx, 0, 3);
  const SZ = CITY_SIZES[state.size];
  rng = mulberry32(state.seed);
  state.objects.length = 0;
  state.lines.length = 0;
  drawLine = -1;
  occ.fill(-1); occT.fill(-1);
  state.selected = -1;
  setTool(null);

  const NB = Math.floor(GRID / PITCH);
  const BK = (bx, bz) => bx + ',' + bz;

  /* ---- 1. a city footprint hugging the coastline ---- */
  const fw = clamp(rint(SZ.fw[0], SZ.fw[1]), 4, Math.max(4, NB - 3));
  const fh = clamp(rint(SZ.fh[0], SZ.fh[1]), 3, Math.max(3, NB - 3));
  const bx0 = clamp(Math.round(NB / 2 - fw / 2 + (rnd() - 0.5) * 4), 1, NB - fw - 1);
  const shoreRow = [];
  for(let bx = bx0; bx < bx0 + fw; bx++){
    let last = -1;
    for(let bz = 0; bz < NB; bz++) if(blockLandFrac(bx, bz) > 0.92) last = bz;
    shoreRow[bx] = last;
  }
  const zone = new Map();
  for(let bx = bx0; bx < bx0 + fw; bx++){
    const bm = shoreRow[bx];
    if(bm < 1) continue;
    for(let bz = Math.max(0, bm - fh + 1); bz <= bm + 1; bz++){
      if(blockLandFrac(bx, bz) > 0.5) zone.set(BK(bx, bz), 'hood');
    }
  }
  if(!zone.size){ for(let bx = 2; bx < NB - 2; bx++) for(let bz = 2; bz < NB - 6; bz++)
    if(blockLandFrac(bx, bz) > 0.9) zone.set(BK(bx, bz), 'hood'); }

  /* ---- 2. one or two business centres near the water ---- */
  const nBiz = SZ.biz === 1 ? 1 : SZ.biz === 3 ? (rnd() < 0.5 ? 2 : 3) : (rnd() < 0.45 ? 1 : 2);
  const biz = [];
  for(let i = 0; i < nBiz; i++){
    for(let att = 0; att < 120; att++){
      const bx = bx0 + 2 + Math.floor(rnd() * Math.max(1, fw - 4));
      const bm = shoreRow[bx];
      if(bm < 2) continue;
      const bz = bm - 1 - Math.floor(rnd() * 2);
      if(zone.get(BK(bx, bz)) !== 'hood') continue;
      if(biz.some(b => Math.abs(b[0] - bx) < 5)) continue;
      biz.push([bx, bz]);
      break;
    }
  }
  const RB = 1.9;
  for(const [sx, sz] of biz){
    for(const k of [...zone.keys()]){
      const c = k.split(',');
      const d = Math.hypot(+c[0] - sx, (+c[1] - sz) * 1.15);
      if(d <= RB) zone.set(k, 'biz');
      else if(d <= RB + 1.25 && zone.get(k) === 'hood') zone.set(k, 'mixed');
    }
  }

  /* ---- 3. one great park, several blocks across, streets and all ---- */
  const vertical = rnd() < 0.5;
  const sizes = vertical ? [[3,5],[5,3],[3,4],[4,3],[3,3],[2,3],[2,2]]
                        : [[5,3],[3,5],[4,3],[3,4],[3,3],[3,2],[2,2]];
  let park = null, pw = 3, ph = 3;
  for(let si = 0; si < sizes.length && !park; si++){
    const [tw, th] = sizes[si];
    const strict = si < sizes.length - 1;
    for(let att = 0; att < 400 && !park; att++){
      const bx = bx0 + Math.floor(rnd() * Math.max(1, fw - tw));
      const bm = shoreRow[bx];
      if(bm < th) continue;
      const bz = bm - 1 - Math.floor(rnd() * Math.max(1, fh - th));
      let ok = true;
      for(let i = 0; i < tw && ok; i++) for(let j = 0; j < th; j++){
        const z = zone.get(BK(bx + i, bz + j));
        if(z !== 'hood' && z !== 'mixed'){ ok = false; break; }
        if(strict && biz.some(b => Math.hypot(b[0] - (bx + i), b[1] - (bz + j)) < RB + 0.6)){ ok = false; break; }
      }
      if(ok){ park = [bx, bz]; pw = tw; ph = th; }
    }
  }
  const parkBlocks = [];
  if(park){
    for(let i = 0; i < pw; i++) for(let j = 0; j < ph; j++){
      zone.set(BK(park[0] + i, park[1] + j), 'park');
      parkBlocks.push([park[0] + i, park[1] + j]);
    }
  }

  /* ---- 4. waterfront promenade ---- */
  for(let gx = bx0 * PITCH - 4; gx < (bx0 + fw) * PITCH + 4; gx += 3){
    if(gx < 1 || gx > GRID - 4) continue;
    const gz = Math.round((shoreZ(wx(gx)) - 20) / CELL + HALF - 0.5);
    for(const dz of [0, -1, 1, -2, 2]){
      if(canPlace('prom', gx, gz + dz, 0, -1)){ addObject('prom', gx, gz + dz, 0); break; }
    }
  }

  /* ---- 5. landmarks ---- */
  const bizBlocks = [...zone.keys()].filter(k => zone.get(k) === 'biz').map(k => k.split(',').map(Number));
  let megaDone = false;
  for(const [bx, bz] of bizBlocks){
    if(megaDone) break;
    if(canPlace('mega', bx * PITCH, bz * PITCH, 0, -1)){ addObject('mega', bx * PITCH, bz * PITCH, 0); megaDone = true; }
  }
  let spireDone = false;
  for(const [bx, bz] of bizBlocks.slice().reverse()){
    if(spireDone) break;
    if(canPlace('spire', bx * PITCH + 1, bz * PITCH + 1, 0, -1)){ addObject('spire', bx * PITCH + 1, bz * PITCH + 1, 0); spireDone = true; }
  }
  if(parkBlocks.length){
    const [ax, az] = parkBlocks[Math.floor(parkBlocks.length / 2)];
    const rot = vertical ? 1 : 0;
    if(canPlace('arch', ax * PITCH + 1, az * PITCH + 1, rot, -1)) addObject('arch', ax * PITCH + 1, az * PITCH + 1, rot);
  }

  /* ---- 5b. superblocks: stadium, malls, factories and outlying forest ---- */
  const placeSpanning = (spec, bx, bz, spread) => {
    const sprd = spread || 3;
    for(let att = 0; att < 50; att++){
      const gx = bx * PITCH - 2 + Math.floor(rnd() * sprd * 2);
      const gz = bz * PITCH - 2 + Math.floor(rnd() * sprd * 2);
      if(canPlace(spec, gx, gz, 0, -1)){ addObject(spec, gx, gz, 0, 0); return true; }
    }
    return false;
  };
  const hoodBlocks = [...zone.keys()].filter(k => zone.get(k) === 'hood').map(k => k.split(',').map(Number));
  const mixedBlocks = [...zone.keys()].filter(k => zone.get(k) === 'mixed').map(k => k.split(',').map(Number));
  const shuffle = arr => { for(let i = arr.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };

  // a stadium on the edge of the built-up area
  {
    const cands = shuffle(mixedBlocks.concat(hoodBlocks).slice(0, 60));
    const size = 6 + Math.floor(rnd() * 3);
    for(const [bx, bz] of cands)
      if(placeSpanning({type:'stadium', w:size, d:size, stories:8 + Math.floor(rnd() * 5)}, bx, bz)) break;
  }
  // one or two shopping malls, some with flats built on the roof
  {
    const cands = shuffle(bizBlocks.concat(mixedBlocks));
    let made = 0;
    const want = 1 + Math.floor(rnd() * 2);
    for(const [bx, bz] of cands){
      if(made >= want) break;
      const spec = {type:'mall', w:4 + Math.floor(rnd()*3), d:4 + Math.floor(rnd()*3), stories:2 + Math.floor(rnd()*3)};
      if(!placeSpanning(spec, bx, bz)) continue;
      made++;
      const mall = state.objects[state.objects.length - 1];
      if(rnd() < 0.75){
        for(let k = 0; k < 1 + Math.floor(rnd() * 2); k++){
          const tw = 2 + Math.floor(rnd() * 2);
          const tower = {type:'apartments', w:tw, d:tw, stories:14 + Math.floor(rnd() * 26)};
          for(let att = 0; att < 30; att++){
            const gx = mall.gx + Math.floor(rnd() * Math.max(1, mall.w - tw + 1));
            const gz = mall.gz + Math.floor(rnd() * Math.max(1, mall.d - tw + 1));
            const lay = layerFor(tower, gx, gz, 0);
            if(lay.lvl === 1 && canPlace(tower, gx, gz, 0, -1)){ addObject(tower, gx, gz, 0, 1); break; }
          }
        }
      }
    }
  }
  // a light-industrial edge, on the flank away from the centre
  {
    const left = rnd() < 0.5;
    const bandX = left ? bx0 - 4 : bx0 + fw + 1;
    const rows = [];
    for(const k of zone.keys()) rows.push(+k.split(',')[1]);
    const zLo = Math.min(...rows), zHi = Math.max(...rows);
    let made = 0;
    for(let att = 0; att < 240 && made < 2 + state.size + Math.floor(rnd() * 3); att++){
      const bx = clamp(bandX + Math.floor(rnd() * 4) - 2, 1, NB - 2);
      const bz = zLo + Math.floor(rnd() * Math.max(1, zHi - zLo));
      const spec = {type:'factory', w:5 + Math.floor(rnd() * 5), d:3 + Math.floor(rnd() * 4),
                    stories:1 + Math.floor(rnd() * 3)};
      if(placeSpanning(spec, bx, bz, 4)) made++;
    }
  }
  // woodland out beyond the last streets
  {
    const rows = [];
    for(const k of zone.keys()) rows.push(+k.split(',')[1]);
    const zLo = Math.min(...rows);
    let made = 0;
    for(let att = 0; att < 300 && made < 2 + state.size + Math.floor(rnd() * 3); att++){
      const bx = 1 + Math.floor(rnd() * (NB - 3));
      const bz = Math.max(1, zLo - 2 - Math.floor(rnd() * 5));
      const spec = {type:'forest', w:6 + Math.floor(rnd() * 6), d:6 + Math.floor(rnd() * 6)};
      if(placeSpanning(spec, bx, bz, 4)) made++;
    }
  }

  /* ---- 6. fill every block by zone ---- */
  const lakeSet = new Set();
  if(parkBlocks.length){
    const nLakes = parkBlocks.length >= 12 ? 2 : 1;
    for(let i = 0; i < nLakes; i++)
      lakeSet.add(parkBlocks[Math.floor(rnd() * parkBlocks.length)].join(','));
  }
  for(const [k, z] of zone){
    const c = k.split(',');
    const bx = +c[0], bz = +c[1];
    const frac = blockLandFrac(bx, bz);
    if(z === 'park'){
      if(lakeSet.has(bx + ',' + bz) && placeInBlock(bx, bz, 'lake', 0)) continue;
      const BIG = {type:'park', w:5, d:5};
      if(rnd() < 0.22 && canPlace({type:'forest', w:5, d:5}, bx * PITCH, bz * PITCH, 0, -1)){
        addObject({type:'forest', w:5, d:5}, bx * PITCH, bz * PITCH, 0); continue;
      }
      if(frac > 0.9 && rnd() < 0.78 && canPlace(BIG, bx * PITCH, bz * PITCH, 0, -1)) addObject(BIG, bx * PITCH, bz * PITCH, 0);
      else fillBlock(bx, bz, rnd() < 0.3 ? [sportsS(), plazaS()] : [parkS(), parkS()]);
      continue;
    }
    if(frac < 0.85){ fillBlock(bx, bz, recipeShore()); continue; }
    if(z === 'biz'){ fillBlock(bx, bz, rnd() < 0.24 ? recipeBizGreen() : recipeBiz()); continue; }
    if(z === 'mixed'){ fillBlock(bx, bz, recipeMixed()); continue; }
    if(rnd() < 0.17){ fillBlock(bx, bz, recipeGreen()); continue; }
    fillBlock(bx, bz, recipeHood());
  }

  /* ---- 7. transit that actually links the pieces ---- */
  const gFrom = bx0 * PITCH - 3, gTo = (bx0 + fw) * PITCH + 3;
  const rows = new Set(), cols = new Set();
  const lineOf = b => nodeGX(clamp(b, 0, NX - 1));
  let zFrom = GRID, zTo = 0;
  for(const k of zone.keys()){ const c = k.split(',');
    zFrom = Math.min(zFrom, +c[1] * PITCH - 3); zTo = Math.max(zTo, +c[1] * PITCH + PITCH + 3); }
  for(const [bx, bz] of biz){ rows.add(lineOf(bz)); cols.add(lineOf(bx)); }
  if(park){ rows.add(lineOf(park[1] + ph - 1)); cols.add(lineOf(park[0] - 1)); }
  let waterRow = 0;
  for(let bx = bx0; bx < bx0 + fw; bx++) waterRow = Math.max(waterRow, shoreRow[bx] || 0);
  rows.add(lineOf(Math.max(0, waterRow - 1)));                 // tram one street inland
  rows.add(lineOf(Math.max(0, waterRow - Math.floor(fh / 2))));

  const stations = [];
  for(const [bx, bz] of biz){ stations.push([lineOf(bx), lineOf(bz)], [lineOf(bx - 2), lineOf(bz - 1)]); }
  if(park) stations.push([lineOf(park[0] - 1), lineOf(park[1])], [lineOf(park[0] + pw - 1), lineOf(park[1] + ph - 1)]);
  stations.push([lineOf(bx0 + 1), lineOf(Math.max(0, waterRow - fh + 2))]);
  stations.push([lineOf(bx0 + fw - 2), lineOf(Math.max(0, waterRow - fh + 3))]);
  for(const [gx, gz] of stations) if(canPlace('subway', gx, gz, 0, -1)) addObject('subway', gx, gz, 0);

  const tramLines = [];
  const addTramLine = (fixed, axis, from, to) => {
    const stops = [];
    for(let i = 0; i < NX; i++){
      const g = nodeGX(i);
      if(g < from || g > to || i % 2) continue;
      const gx = axis === 'x' ? g : fixed, gz = axis === 'x' ? fixed : g;
      const srot = axis === 'x' ? 0 : 1;
      if(!canPlace('tramstop', gx, gz, srot, -1)) continue;
      addObject('tramstop', gx, gz, srot);
      stops.push(state.objects[state.objects.length - 1].uid);
    }
    if(stops.length > 1)
      tramLines.push({mode:'tram', c: tramLines.length % METRO_COLS.length, stops});
  };
  for(const r of rows) addTramLine(r, 'x', gFrom, gTo);
  for(const c2 of cols) addTramLine(c2, 'z', zFrom, zTo);

  const bikeRows = [], bikeCols = [];
  for(let i = 0; i < NX; i++){
    const g = nodeGX(i);
    if(g > zFrom && g < zTo && !rows.has(g) && i % 2 === 0) bikeRows.push(g);
    if(g > gFrom && g < gTo && !cols.has(g) && i % 2 === 1) bikeCols.push(g);
  }
  for(const r of bikeRows.slice(0, 5)) placeLine('bike', r, 'x', gFrom, gTo);
  for(const c2 of bikeCols.slice(0, 5)) placeLine('bike', c2, 'z', zFrom, zTo);
  // the waterfront promenade street: the lowest line that is still mostly on land
  let walkLine = -1;
  for(let i = 0; i < NX; i++){
    const line = nodeGX(i);
    if(rows.has(line) || line < zFrom || line > zTo) continue;
    let n = 0;
    for(let g = Math.max(1, gFrom); g <= Math.min(GRID - 2, gTo); g++) if(canPlace('walk', g, line, 0, -1)) n++;
    if(n > 8 && line > walkLine) walkLine = line;
  }
  if(walkLine >= 0) placeLine('walk', walkLine, 'x', gFrom, gTo);
  state.lines = autoLines(state.objects.filter(o => o.type === 'subway'), 0, 'subway').concat(tramLines);

  state.hour = 7.2; state.simTime = 7.2;
  rebuildCity();
  resetCamera(false);
}

/* ============================================================================
   14.  WORLD UPDATE + MAIN LOOP
   ========================================================================== */

let perfNow = 0;
let shadowSize = 330;
const _c = new THREE.Color();

function phaseName(h){
  if(h < 5) return 'Night';
  if(h < 6.8) return 'Dawn';
  if(h < 11) return 'Morning';
  if(h < 14) return 'Midday';
  if(h < 17) return 'Afternoon';
  if(h < 19.2) return 'Golden hour';
  if(h < 21) return 'Dusk';
  return 'Night';
}

function updateWorld(h, dt){
  const p = dayPalette(h);
  const sd = sunDirection(h);

  const lTop = L3(p.top), lMid = L3(p.mid), lBot = L3(p.bot), lSun = L3(p.sun), lFog = L3(p.fog);
  skyU.uTop.value.set(lTop[0], lTop[1], lTop[2]);
  skyU.uMid.value.set(lMid[0], lMid[1], lMid[2]);
  skyU.uBot.value.set(lBot[0], lBot[1], lBot[2]);
  skyU.uSunDir.value.copy(sd.dir);
  skyU.uSunCol.value.set(lSun[0] * (sd.moon ? 0.55 : 1), lSun[1] * (sd.moon ? 0.6 : 1), lSun[2] * (sd.moon ? 0.75 : 1));
  skyU.uNight.value = p.night;

  sun.color.setRGB(lSun[0], lSun[1], lSun[2]);
  sun.intensity = p.si;
  sun.position.copy(cam.target).addScaledVector(sd.dir, 720);
  sun.target.position.copy(cam.target);
  sun.target.updateMatrixWorld();

  const want = clamp(cam.dist * 0.80, 140, 640);
  if(Math.abs(want - shadowSize) > 30){
    shadowSize = want;
    sun.shadow.camera.left = -want; sun.shadow.camera.right = want;
    sun.shadow.camera.top = want; sun.shadow.camera.bottom = -want;
    sun.shadow.camera.updateProjectionMatrix();
  }
  hemi.intensity = p.hemi;
  hemi.color.setRGB(clamp(lMid[0] + 0.06, 0, 1), clamp(lMid[1] + 0.08, 0, 1), clamp(lMid[2] + 0.12, 0, 1));
  hemi.groundColor.setRGB(0.06 + p.hemi * 0.06, 0.08 + p.hemi * 0.07, 0.05 + p.hemi * 0.04);
  fill.intensity = 0.06 + p.hemi * 0.16;

  scene.fog.color.setRGB(lFog[0], lFog[1], lFog[2]);

  cityU.uNight.value = p.night;
  cityU.uLit.value = p.lit;

  waterU.uTime.value += dt;
  waterU.uSky.value.set(lMid[0] * 0.85 + lTop[0] * 0.35, lMid[1] * 0.85 + lTop[1] * 0.35, lMid[2] * 0.85 + lTop[2] * 0.35);
  waterU.uSunCol.value.set(lSun[0] * p.si * 0.9, lSun[1] * p.si * 0.9, lSun[2] * p.si * 0.9);
  waterU.uSunDir.value.copy(sd.dir);
  waterU.uFog.value.set(lFog[0], lFog[1], lFog[2]);
  waterU.uNight.value = p.night;

  const n = p.night;
  if(lampMesh){ lampMesh.visible = n > 0.10; matBulb.color.setRGB(n, n * 0.82, n * 0.58); }
  if(poolMesh){ poolMesh.visible = n > 0.10; matPool.opacity = 0.20 * n; }
  matTram.emissiveIntensity = 0.6 * n;
  const shopV = lerp(0.24, 1.75, n);
  matShop.color.setRGB(shopV, shopV, shopV);
}

let hudT = 0;
function updateHUD(h){
  const hh = Math.floor(h) % 24, mm = Math.floor((h % 1) * 60);
  $('clock').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  $('phase').textContent = phaseName(h);
  if(!sliderActive) slider.value = String(h.toFixed(2));
}

let last = performance.now();
let firstFrame = true;
function frame(now){
  requestAnimationFrame(frame);
  perfNow = now;
  const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
  last = now;

  if(state.speed > 0){
    const adv = dt * state.speed * 24 / DAY_SECONDS;
    state.hour += adv; state.simTime += adv;
  }
  if(state.hour >= 24) state.hour -= 24;
  if(state.hour < 0) state.hour += 24;

  updateCameraInput(dt);
  updateWorld(state.hour, dt);
  const boost = state.speed === 0 ? 0 : Math.sqrt(state.speed);
  if(boost > 0){
    updateAgents(dt, state.hour, boost);
    updateTrams(dt, boost);
  }
  if(now - hudT > 120){ hudT = now; updateHUD(state.hour); }

  skyMesh.position.copy(camera.position);
  water.position.x = camera.position.x;
  water.position.z = clamp(camera.position.z, 100, 3200);

  renderer.render(scene, camera);

  if(firstFrame){
    firstFrame = false;
    setTimeout(() => { $('loading').classList.add('hide'); }, 260);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('beforeunload', saveLocal);
document.addEventListener('visibilitychange', () => { if(document.hidden) saveLocal(); });

/* ============================================================================
   15.  BOOT
   ========================================================================== */

buildEdge();
buildPalette();
setMode('view');
setSpeed(1);

let restored = false;
try {
  const raw = localStorage.getItem(LS_KEY);
  if(raw){
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.objects) && d.objects.length){ applyCity(d); restored = true; }
  }
} catch(err){ restored = false; }
if(!restored) generateCity((Math.random() * 1e9) | 0);

updateHUD(state.hour);
requestAnimationFrame(frame);

window.__city = {state, generateCity, blankCity, resizeWorld, setMetroView, applyCity, serialise,
  rebuildCity, agents, G, TYPES, MAP_SIZES, CITY_SIZES,
  getOcc:()=>occ, getOccT:()=>occT, getGrid:()=>GRID, getSignMesh:()=>signMesh, hasAtlas:()=>!!signAtlas,
  addStopAt, finishLine, setDrawLine:(i)=>{drawLine=i;}, getDrawLine:()=>drawLine, autoLines, pruneLines,
  getTrams:()=>trams, selectLine, getLinePick:()=>linePickLine.length, tramCell,
  layerFor, withRiders, storiesOf, hostLift, resolvePlacement, occupantsUnder, removeMany,
  addObject, removeObject, canPlace, fits, cellsOf, oi, cellFromWorld, FACADES, STYLES, SPORTS};
</script>
