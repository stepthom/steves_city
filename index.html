<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steve's City</title>
<style>
  :root{
    --glass: rgba(18,26,34,0.52);
    --glass-2: rgba(255,255,255,0.10);
    --stroke: rgba(255,255,255,0.16);
    --text: #eef4f7;
    --dim: #a9bcc6;
    --accent: #6fd6c2;
    --accent-2: #ffc879;
    --shadow: 0 10px 34px rgba(0,0,0,0.30);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1418;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;}
  canvas{display:block;position:fixed;inset:0;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .panel{
    pointer-events:auto;position:absolute;background:var(--glass);
    border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--shadow);
    backdrop-filter:blur(16px) saturate(1.25); -webkit-backdrop-filter:blur(16px) saturate(1.25);
  }
  #topleft{top:16px;left:16px;padding:12px 16px 12px 16px;min-width:184px;max-width:264px}
  .clock{font-size:30px;font-weight:600;letter-spacing:0.5px;line-height:1.05;font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:8px}
  .clock .phase{font-size:11px;font-weight:600;color:var(--accent-2);letter-spacing:1.4px;text-transform:uppercase}
  .stats{margin-top:9px;display:flex;gap:16px}
  .stat{line-height:1.15}
  .stat b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:9.5px;color:var(--dim);letter-spacing:1.1px;text-transform:uppercase}

  #topright{top:16px;right:16px;padding:10px;display:flex;gap:8px;align-items:center}
  .seg{display:flex;background:rgba(0,0,0,0.24);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:12px;font-weight:600;
    padding:7px 13px;border-radius:9px;cursor:pointer;transition:.15s}
  .seg button:hover{color:#fff}
  .seg button.on{background:var(--accent);color:#06231f;box-shadow:0 2px 10px rgba(111,214,194,.35)}
  .btn{border:1px solid var(--stroke);background:var(--glass-2);color:var(--text);font:inherit;font-size:12px;
    font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
  .btn.on{background:var(--accent);color:#06231f;border-color:transparent}
  .btn:active{transform:translateY(0)}

  #bottomright{bottom:16px;right:16px;padding:10px;display:flex;gap:10px;align-items:center}
  #timeslider{width:150px;accent-color:var(--accent);cursor:pointer}
  .lbl{font-size:9.5px;color:var(--dim);letter-spacing:1.1px;text-transform:uppercase;margin-right:2px}

  #palette{left:16px;bottom:16px;padding:12px;width:246px;max-height:calc(100vh - 190px);overflow-y:auto;
    display:none;scrollbar-width:thin}
  #palette.show{display:block}
  #palette::-webkit-scrollbar{width:7px}
  #palette::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  .pgroup{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);
    margin:10px 0 6px;font-weight:700}
  .pgroup:first-child{margin-top:0}
  .pitems{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .pitem{border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:9px;padding:7px 8px;
    cursor:pointer;font-size:11px;font-weight:600;transition:.13s;display:flex;align-items:center;gap:7px;text-align:left}
  .pitem:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
  .pitem.on{background:var(--accent);color:#06231f;border-color:transparent}
  .pitem.dim{opacity:.32}
  .pitem .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
  .phint{margin-top:11px;font-size:10.5px;color:var(--dim);line-height:1.5;border-top:1px solid var(--stroke);padding-top:9px}
  .phint kbd{background:rgba(255,255,255,.14);border-radius:4px;padding:1px 5px;font:inherit;font-size:10px}

  #legend{right:16px;bottom:78px;padding:11px 13px;display:none}
  #legend.show{display:block}
  .lgt{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  .lgr{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-bottom:4px}
  .lgr i{width:18px;height:5px;border-radius:3px;display:inline-block}
  #inspect{top:78px;right:16px;width:240px;padding:13px;display:none}
  #inspect.show{display:block}
  .ihead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .ihead span.t{font-size:13.5px;font-weight:600}
  .ihead span.k{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
  .irow{margin-bottom:11px}
  .irow label{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;
    letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .irow label b{color:var(--text);font-size:11.5px;letter-spacing:0;font-variant-numeric:tabular-nums}
  .irow input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;margin:0}
  .sws{display:flex;gap:5px;flex-wrap:wrap}
  .sw2{width:23px;height:23px;border-radius:7px;border:1px solid var(--stroke);cursor:pointer;padding:0}
  .sw2.on{outline:2px solid var(--accent);outline-offset:1px}
  .opts{display:flex;gap:4px;flex-wrap:wrap}
  .opt{border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--text);font:inherit;
    font-size:10.5px;font-weight:600;padding:5px 8px;border-radius:8px;cursor:pointer;transition:.13s}
  .opt:hover{background:rgba(255,255,255,.16)}
  .opt.on{background:var(--accent);color:#06231f;border-color:transparent}
  .icap{font-size:10.5px;color:var(--dim);line-height:1.5;margin:2px 0 10px}
  .lrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:9px;margin-bottom:4px;
    background:rgba(255,255,255,.05);border:1px solid transparent}
  .lrow.on{border-color:var(--accent);background:rgba(111,214,194,.14)}
  .lcol{width:16px;height:16px;border-radius:5px;border:1px solid var(--stroke);cursor:pointer;padding:0;flex:0 0 auto}
  .lname{font-size:11.5px;font-weight:600}
  .lcount{font-size:10px;color:var(--dim);margin-left:auto}
  .lbtn{border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--text);font:inherit;
    font-size:10px;font-weight:600;padding:3px 7px;border-radius:7px;cursor:pointer}
  .lbtn:hover{background:rgba(255,255,255,.18)}
  .icap b{color:var(--text)}
  .counts{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--stroke)}
  .counts i{font-style:normal;font-size:10px;color:var(--dim)}
  .counts b{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  #tip{position:absolute;pointer-events:none;background:rgba(10,16,20,.86);border:1px solid var(--stroke);
    border-radius:9px;padding:6px 9px;font-size:11.5px;line-height:1.45;display:none;max-width:220px;
    box-shadow:var(--shadow);backdrop-filter:blur(8px)}
  #tip b{color:var(--accent)}
  #toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(10,16,20,.86);
    border:1px solid var(--stroke);border-radius:11px;padding:9px 15px;font-size:12.5px;opacity:0;
    transition:opacity .35s, transform .35s;box-shadow:var(--shadow)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  #modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(6,12,16,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  #modal.show{display:flex}
  .dlg{position:relative;width:404px;max-width:calc(100vw - 32px);padding:20px 22px 18px;pointer-events:auto}
  .dlg h2{margin:0 0 16px;font-size:17px;font-weight:600;letter-spacing:.2px}
  .drow{margin-bottom:15px}
  .drow label{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;
    letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  .drow label b{color:var(--accent);font-size:11px;letter-spacing:0;text-transform:none;font-weight:600}
  .dnote{font-size:10.5px;color:var(--dim);line-height:1.55;margin:-2px 0 16px}
  .dfoot{display:flex;gap:8px;align-items:center}
  .dfoot .sp{flex:1}
  .btn.go{background:var(--accent);color:#06231f;border-color:transparent}
  .btn.go:hover{background:#8ee6d3}
  #loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:linear-gradient(170deg,#0e1c26,#132b2b 55%,#1b3330);
    transition:opacity .7s;font-size:13px;letter-spacing:.4px;color:#cfe6e0}
  #loading.hide{opacity:0;pointer-events:none}
  #loading h1{margin:0;font-size:26px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:#eaf6f2}
  .spin{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.16);border-top-color:var(--accent);
    border-radius:50%;animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{max-width:520px;text-align:center;line-height:1.6;font-size:12.5px;color:#ffd7d7;display:none}
  #err code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:5px}
  @media (max-width:820px){ .stats{gap:11px} #palette{width:210px} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

} }

<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="panel" id="topleft">
    <div class="clock"><span id="clock">07:00</span><span class="phase" id="phase">Morning</span></div>
    <div class="stats">
      <div class="stat"><b id="pop">0</b><span>Residents</span></div>
      <div class="stat"><b id="jobs">0</b><span>Jobs</span></div>
      <div class="stat"><b id="outside">0</b><span>Out &amp; about</span></div>
    </div>
    <div class="counts" id="counts"></div>
  </div>

  <div class="panel" id="topright">
    <div class="seg" id="modeseg">
      <button data-mode="view" class="on">View</button>
      <button data-mode="edit">Edit</button>
    </div>
    <button class="btn" id="btnMetro" title="Transit map (M)">Transit</button>
    <button class="btn" id="btnNew">New City</button>
    <button class="btn" id="btnSave">Save</button>
    <button class="btn" id="btnLoad">Load</button>
    <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
  </div>

  <div class="panel" id="bottomright">
    <div class="seg" id="speedseg">
      <button data-sp="0">❚❚</button>
      <button data-sp="1" class="on">1×</button>
      <button data-sp="4">4×</button>
      <button data-sp="16">16×</button>
    </div>
    <span class="lbl">Hour</span>
    <input type="range" id="timeslider" min="0" max="23.99" step="0.01" value="7">
    <button class="btn" id="btnReset" title="Reset camera (R)">Reset view</button>
  </div>

  <div class="panel" id="palette"></div>
  <div class="panel" id="legend">
    <div class="lgt">Ways to get around</div>
    <div class="lgr"><i style="background:linear-gradient(90deg,#3d9bff,#ff6f5a,#4fd18a)"></i>Tram lines</div>
    <div class="lgr"><i style="background:linear-gradient(90deg,#3d9bff,#ff6f5a,#4fd18a)"></i>Subway lines <span style="color:var(--dim)">(raised)</span></div>
    <div class="lgr"><i style="background:#47ccb3"></i>Bike path</div>
    <div class="lgr"><i style="background:#ebdcb8"></i>Walking path</div>
  </div>
  <div class="panel" id="inspect"></div>
  <div id="tip"></div>
  <div id="toast"></div>
</div>

<div id="modal">
  <div class="dlg panel">
    <h2>New City</h2>
    <div class="drow">
      <label>Map size <b id="dmapv"></b></label>
      <div class="opts" id="dmap"></div>
    </div>
    <div class="drow">
      <label>City size <b id="dpopv"></b></label>
      <div class="opts" id="dpop"></div>
    </div>
    <div class="dnote">The map is the whole buildable area. The city fills part of it — the rest is
      open country you can expand into.</div>
    <div class="dfoot">
      <button class="btn" id="dblank">Blank map</button>
      <span class="sp"></span>
      <button class="btn" id="dcancel">Cancel</button>
      <button class="btn go" id="dgo">Build it</button>
    </div>
  </div>
</div>

<div id="loading">
  <h1>Steve&#39;s City</h1>
  <div class="spin" id="spin"></div>
  <div id="lmsg">growing a city by the water…</div>
  <div id="err"></div>
</div>

<script>
  // Friendly failure if modules can't load (e.g. opened via file:// in a strict browser).
  window.__booted = false;
  setTimeout(function(){
    if(!window.__booted){
      var e=document.getElementById('err'), s=document.getElementById('spin'), m=document.getElementById('lmsg');
      if(s) s.style.display='none'; if(m) m.style.display='none';
      if(e){ e.style.display='block';
        e.innerHTML = "Couldn&#39;t start. This needs an internet connection (Three.js loads from a CDN), "+
        "and some browsers block modules on <code>file://</code>.<br><br>Serve the folder instead:<br>"+
        "<code>python -m http.server 8626 -d .</code><br>then open <code>http://localhost:8626</code>";
      }
    }
  }, 9000);
</script>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

window.__booted = true;

/* ============================================================================
   0.  CONSTANTS & SMALL UTILITIES
   ========================================================================== */

const CELL   = 9;        // metres per grid cell
const STORY  = 3.6;      // metres per storey
const PITCH  = 6;        // block pitch in cells: 5 build cells + 1 street cell
let GRID     = 144;      // cells across the buildable grid — set by the New City dialog
let HALF     = GRID / 2;
let WORLD    = GRID * CELL;
let SHORE    = 395;      // how far out the coast sits
const MAP_SIZES  = [{n:'Small', g:96}, {n:'Medium', g:144}, {n:'Large', g:192}, {n:'Huge', g:240}];
const CITY_SIZES = [
  {n:'Village',    fw:[5,7],   fh:[4,6],   biz:1, per:550},
  {n:'Town',       fw:[8,10],  fh:[6,8],   biz:1, per:740},
  {n:'City',       fw:[14,18], fh:[10,13], biz:2, per:1080},
  {n:'Metropolis', fw:[26,31], fh:[17,21], biz:3, per:1450},
];

const DAY_SECONDS = 420;             // real seconds for one full day at 1x
const MAX_AGENTS  = 2400;

const isStreetIdx = i => ((i % PITCH) + PITCH) % PITCH === PITCH - 1;

const wx = gx => (gx - HALF + 0.5) * CELL;            // centre of cell gx
const wz = gz => (gz - HALF + 0.5) * CELL;
const cellFromWorld = (x, z) => [Math.floor(x / CELL + HALF), Math.floor(z / CELL + HALF)];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
/* authored colours are sRGB; three's working space is linear */
const s2l = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const L3 = c => [s2l(c[0]), s2l(c[1]), s2l(c[2])];

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const rnd  = () => rng();
const rrange = (a, b) => a + rng() * (b - a);
const rint = (a, b) => Math.floor(a + rng() * (b - a + 1));
const pick = arr => arr[Math.floor(rng() * arr.length) % arr.length];

function hash2(x, y){
  let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

/* Shoreline: water lies at z greater than shoreZ(x). Mirrored exactly in GLSL. */
const shoreZ = x => SHORE + 46 * Math.sin(x * 0.009) + 26 * Math.sin(x * 0.026 + 1.7);
const isLand = (x, z) => z < shoreZ(x) - 2;

/* Terrain height: flat across the city, gentle rolling hills far away, sea bed offshore. */
function terrainH(x, z){
  const d = shoreZ(x) - z;                                         // >0 = inland
  const base = d >= 0
    ? -1.35 + 1.35 * smoothstep(0, 30, d)                          // beach ramp up to y=0
    : -1.35 + clamp(d, -150, 0) * 0.046;                           // sea bed falling away
  const out = Math.max(0, Math.max(Math.abs(x) - WORLD * 0.55, Math.abs(z) - WORLD * 0.55)) / 260;
  const hills = Math.max(0, (vnoise(x * 0.0035, z * 0.0035) - 0.42) * 90 * clamp(out, 0, 1.6));
  return base + hills * smoothstep(0, 70, d);
}

const fmtN = n => n.toLocaleString('en-US');
const $ = id => document.getElementById(id);

let toastT = 0;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ============================================================================
   1.  PALETTES & OBJECT TYPES
   ========================================================================== */

const FACADE = {
  cream:     [0.905, 0.870, 0.800],
  sand:      [0.855, 0.780, 0.665],
  terracotta:[0.780, 0.520, 0.400],
  clay:      [0.720, 0.470, 0.390],
  glass:     [0.640, 0.730, 0.735],
  glassBlue: [0.560, 0.670, 0.740],
  bone:      [0.940, 0.925, 0.885],
  stone:     [0.760, 0.760, 0.735],
  warmGrey:  [0.700, 0.685, 0.655],
};
const GREEN_ROOF = [0.360, 0.520, 0.290];
const GREEN_ROOF2= [0.300, 0.450, 0.280];

/* Editable facade colours, shared by every building type. */
const FACADES = [
  {n:'Cream',      c:[0.905,0.870,0.800], sw:'#e9dfcc'},
  {n:'Sand',       c:[0.855,0.780,0.665], sw:'#dcc9ab'},
  {n:'Terracotta', c:[0.780,0.520,0.400], sw:'#c98b6b'},
  {n:'Clay',       c:[0.720,0.470,0.390], sw:'#b87c66'},
  {n:'Bone',       c:[0.940,0.925,0.885], sw:'#f0ece4'},
  {n:'Stone',      c:[0.760,0.760,0.735], sw:'#c2c2bc'},
  {n:'Sea glass',  c:[0.640,0.730,0.735], sw:'#a3bbbc'},
  {n:'Blue glass', c:[0.560,0.670,0.740], sw:'#8fabbd'},
];
const STYLES = ['Modern','Art deco','Glass','Gothic','Brick'];
const STYLE_TINTS = [[4,5,6,7,0],[0,1,5,4,2],[6,7,5,4,6],[5,4,3,1,0],[2,3,1,2,3]];
const SPORTS = ['Soccer','Tennis','Basketball'];
const WARM_TINTS = [0,1,2,3,4,1,0,2];
const COOL_TINTS = [6,7,5,4,6,7,0,5];

/* One entry per kind of thing. Storeys, footprint and colour live on each
   placed object, so every one of them can be edited after the fact. */
const TYPES = {
  apartments:{label:'Apartments',   cat:'Housing', kind:'building', use:'home', w:2, d:2, stories:24,
              minS:4, maxS:110, minW:2, maxW:5, sw:'#d9b48f', res:5.0, job:0.6},
  office:    {label:'Office',       cat:'Work',    kind:'building', use:'work', w:3, d:3, stories:80,
              minS:4, maxS:200, minW:2, maxW:5, sw:'#8fb4c4', job:3.4},
  hospital:  {label:'Hospital',     cat:'Civic',   kind:'building', use:'work', w:4, d:4, stories:24,
              minS:4, maxS:60, minW:3, maxW:5, sw:'#e3ebee', job:3.2},
  school:    {label:'School',       cat:'Civic',   kind:'building', use:'work', w:4, d:3, stories:5,
              minS:4, maxS:16, minW:3, maxW:5, sw:'#e8d6a8', job:14},

}

function buildTerrain(){
  const S = Math.max(3800, WORLD * 2.9);
  const N = clamp(Math.round(S / 21), 170, 300);
  const g = new THREE.PlaneGeometry(S, S, N, N);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  for(let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const y = terrainH(x, z);
    pos.setY(i, y);
    const d = shoreZ(x) - z;
    const n = vnoise(x * 0.02, z * 0.02);
    const gi = Math.floor(n * 4) % 4;
    let c = GRASS[gi].slice();
    const beachMix = 1 - smoothstep(16, 40, d);
    c = [lerp(c[0],SAND[0],beachMix), lerp(c[1],SAND[1],beachMix), lerp(c[2],SAND[2],beachMix)];
    if (y < SEA){ const k = smoothstep(0, -6, y - SEA) * 0.75; c = [lerp(c[0],.16,k), lerp(c[1],.28,k), lerp(c[2],.30,k)]; }
    const out2 = Math.max(Math.abs(x) - WORLD / 2, Math.abs(z) - WORLD / 2);
    if(out2 > 0){ const k = smoothstep(0, 110, out2) * 0.5;
      c = [lerp(c[0],.40,k), lerp(c[1],.42,k), lerp(c[2],.39,k)]; }
    const v = 0.92 + n * 0.16;
    col[i*3] = s2l(c[0])*v; col[i*3+1] = s2l(c[1])*v; col[i*3+2] = s2l(c[2])*v;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  terrainMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.97, metalness:0.0});
  const mesh = new THREE.Mesh(g, terrainMat);
  mesh.receiveShadow = true;
  mesh.name = 'terrain';
  return mesh;
}

function withWindows(mat){
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uNight = cityU.uNight;
    sh.uniforms.uLit = cityU.uLit;
    sh.uniforms.uWarm = cityU.uWarm;
    sh.vertexShader = 'attribute float aSeed;\nvarying float vSeed;\nvarying vec3 vWP;\nvarying vec3 vWN;\n' + sh.vertexShader;
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vSeed = aSeed;
      vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vWN = normalize(mat3(modelMatrix) * objectNormal);`);
    sh.fragmentShader = 'varying float vSeed;\nvarying vec3 vWP;\nvarying vec3 vWN;\nuniform float uNight;\nuniform float uLit;\nuniform vec3 uWarm;\n' + sh.fragmentShader;
    sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      float winLit = 0.0;
      if (vSeed > 0.0005) {
        float sty = floor(vSeed);
        float sdd = fract(vSeed);
        float cw = 3.0, x0 = 0.13, x1 = 0.87, y0 = 0.26, y1 = 0.90, base = 7.2;
        if (sty > 3.5)      { cw = 3.7; x0 = 0.29; x1 = 0.71; y0 = 0.30; y1 = 0.84; }
        else if (sty > 2.5) { cw = 2.3; x0 = 0.28; x1 = 0.72; y0 = 0.12; y1 = 0.93; }
        else if (sty > 1.5) { cw = 2.7; x0 = 0.04; x1 = 0.96; y0 = 0.07; y1 = 0.97; }
        else if (sty > 0.5) { cw = 2.5; x0 = 0.25; x1 = 0.75; y0 = 0.15; y1 = 0.95; }
        vec3 nn = normalize(vWN);
        float horiz = step(abs(nn.y), 0.55);
        float uu = abs(nn.x) > abs(nn.z) ? vWP.z : vWP.x;
        float fy = vWP.y;
        float su = uu / cw + sdd * 5.7;
        float sv = fy / 3.6 + 0.15;
        float cu = floor(su), cv = floor(sv);
        vec2 f = vec2(fract(su), fract(sv));
        float win = horiz * step(x0, f.x) * step(f.x, x1)
                          * step(y0, f.y) * step(f.y, y1) * step(base, fy);
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 0.55 + vec3(0.05,0.09,0.11), win * 0.78);
        float hsh = fract(sin(cu * 12.9898 + cv * 78.233 + sdd * 411.7) * 43758.5453);
        float flick = 0.85 + 0.15 * step(0.5, fract(hsh * 3.0));
        winLit = win * step(hsh, uLit) * flick;
      }`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += uWarm * winLit * uNight * 2.6;`);
  };
  mat.customProgramCacheKey = () => 'cityWindows';
  return mat;
}

function signQuad(S, g, cx, cy, cz, w, h, face){
  if(!signAtlas) return;
  const u0 = (g % 4) * 0.25, v0 = 1 - (Math.floor(g / 4) + 1) * 0.25;
  const u1 = u0 + 0.25, v1 = v0 + 0.25;
  const hw = w / 2, hh = h / 2;
  let P, nrm;
  if(face === 'up'){
    P = [[cx-hw,cy,cz+hh],[cx+hw,cy,cz+hh],[cx+hw,cy,cz-hh],[cx-hw,cy,cz-hh]];
    nrm = [0,1,0];
  } else if(face === 'z+'){
    P = [[cx-hw,cy-hh,cz],[cx+hw,cy-hh,cz],[cx+hw,cy+hh,cz],[cx-hw,cy+hh,cz]]; nrm = [0,0,1];
  } else if(face === 'z-'){
    P = [[cx+hw,cy-hh,cz],[cx-hw,cy-hh,cz],[cx-hw,cy+hh,cz],[cx+hw,cy+hh,cz]]; nrm = [0,0,-1];
  } else if(face === 'x+'){
    P = [[cx,cy-hh,cz+hw],[cx,cy-hh,cz-hw],[cx,cy+hh,cz-hw],[cx,cy+hh,cz+hw]]; nrm = [1,0,0];
  } else {
    P = [[cx,cy-hh,cz-hw],[cx,cy-hh,cz+hw],[cx,cy+hh,cz+hw],[cx,cy+hh,cz-hw]]; nrm = [-1,0,0];
  }
  const UV = [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
  const b = S.v;
  for(let i = 0; i < 4; i++){
    S.p.push(P[i][0], P[i][1], P[i][2]);
    S.n.push(nrm[0], nrm[1], nrm[2]);
    S.uv.push(UV[i][0], UV[i][1]);

}

  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(S.n), 3));

/* Where each type wears its symbol. */
function emitSigns(S, o){
  const key = GLYPH[o.type];
  if(key === undefined) return;
  const T = TYPES[o.type];
  const c = objCentre(o), f = footprint(o);
  const W = f.w * CELL, D = f.d * CELL;
  const st = storiesOf(o);
  const lift = o._lift || 0;
  if(o.type === 'subway'){
    const px = o._signX !== undefined ? o._signX : wx(o.gx) + 3.4;
    const pz = o._signZ !== undefined ? o._signZ : wz(o.gz);
    signQuad(S, key, px, 4.6, pz + 0.18, 2.6, 2.6, 'z+');
    signQuad(S, key, px, 4.6, pz - 0.18, 2.6, 2.6, 'z-');
    signQuad(S, key, px + 0.18, 4.6, pz, 2.6, 2.6, 'x+');
    signQuad(S, key, px - 0.18, 4.6, pz, 2.6, 2.6, 'x-');
    return;
  }
  if(o.type === 'tramstop'){
    const px = o._signX !== undefined ? o._signX : wx(o.gx);
    const pz = o._signZ !== undefined ? o._signZ : wz(o.gz);
    signQuad(S, key, px, 5.3, pz + 0.18, 2.4, 2.4, 'z+');
    signQuad(S, key, px, 5.3, pz - 0.18, 2.4, 2.4, 'z-');
    signQuad(S, key, px + 0.18, 5.3, pz, 2.4, 2.4, 'x+');
    signQuad(S, key, px - 0.18, 5.3, pz, 2.4, 2.4, 'x-');
    return;

  const capW = o._capW || W, capD = o._capD || D;
  const capY = lift + (o._capY !== undefined ? o._capY : st * STORY);
  // badges hang on all four walls, just below the parapet, clear of any style trim
  const tall = st > 12;
  const wallH = Math.max(4, capY - lift);
  const scale = o.type === 'apartments' ? 0.8 : 1;
  const fs = Math.min(clamp(Math.min(capW, capD) * (tall ? 0.42 : 0.36) * scale, 3.2, 16), wallH * 0.62);
  const fy = Math.max(lift + wallH * 0.45, capY - fs * 0.62 - 1.2);

  const clear = o.type === 'stadium' ? 1.3
              : style === 1 ? 1.05                      // clear the deco fins
              : style === 4 ? 0.8                       // clear the string courses
              : style === 2 ? 0.5
              : 0.6;                                    // clear the cornice
  const ex = capW / 2 + clear;
  const ez = capD / 2 + clear;
  signQuad(S, key, c.x, fy, c.z + ez, fs, fs, 'z+');
  signQuad(S, key, c.x, fy, c.z - ez, fs, fs, 'z-');
  signQuad(S, key, c.x + ex, fy, c.z, fs, fs, 'x+');
  signQuad(S, key, c.x - ex, fy, c.z, fs, fs, 'x-');
}

/* --- geometry accumulation -------------------------------------------------
   Boxes and ground quads are the overwhelming majority of the city's geometry,
   so they are written straight into growable typed arrays. Rarer shapes
   (cylinders, tilted boxes, discs) stay as ordinary geometries and are merged
   alongside the batch. ------------------------------------------------------ */
const FACES = [
  {n:[ 1,0,0], u:[0,0,-1], v:[0,1,0]},
  {n:[-1,0,0], u:[0,0, 1], v:[0,1,0]},
  {n:[0, 1,0], u:[1,0, 0], v:[0,0,-1]},
  {n:[0,-1,0], u:[1,0, 0], v:[0,0, 1]},
  {n:[0,0, 1], u:[1,0, 0], v:[0,1,0]},
  {n:[0,0,-1], u:[-1,0,0], v:[0,1,0]},
];
const BOX_V = new Float32Array(72), BOX_N = new Float32Array(72);
const BOX_I = new Uint16Array(36);
(() => {
  let vi = 0, ii = 0;
  for(let f = 0; f < 6; f++){
    const {n, u, v} = FACES[f];
    const corners = [[-0.5,-0.5],[0.5,-0.5],[0.5,0.5],[-0.5,0.5]];
    const base = f * 4;
    for(const [a, b] of corners){
      for(let k = 0; k < 3; k++){
        BOX_V[vi] = n[k] * 0.5 + u[k] * a + v[k] * b;
        BOX_N[vi] = n[k];
        vi++;
      }
    }
    BOX_I[ii++] = base;     BOX_I[ii++] = base + 1; BOX_I[ii++] = base + 2;
    BOX_I[ii++] = base;     BOX_I[ii++] = base + 2; BOX_I[ii++] = base + 3;
  }
})();

function newBatch(cap = 4096){
  return {p:new Float32Array(cap*3), nr:new Float32Array(cap*3), c:new Float32Array(cap*3),
          sd:new Float32Array(cap), idx:new Uint32Array(cap*2), v:0, ic:0, geo:[]};
}
function grow(b, addV, addI){
  if(b.v + addV > b.sd.length){
    let cap = b.sd.length;
    while(cap < b.v + addV) cap *= 2;
    const p = new Float32Array(cap*3); p.set(b.p); b.p = p;
    const nr = new Float32Array(cap*3); nr.set(b.nr); b.nr = nr;
    const c = new Float32Array(cap*3); c.set(b.c); b.c = c;
    const sd = new Float32Array(cap); sd.set(b.sd); b.sd = sd;
  }
  if(b.ic + addI > b.idx.length){
    let cap = b.idx.length;
    while(cap < b.ic + addI) cap *= 2;
    const i = new Uint32Array(cap); i.set(b.idx); b.idx = i;
  }
}
function batchGeometry(b){
  if(!b.v) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b.p.subarray(0, b.v*3), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(b.nr.subarray(0, b.v*3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(b.c.subarray(0, b.v*3), 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(b.sd.subarray(0, b.v), 1));

  for(let i = 0; i < n; i++){ c[i*3] = r0; c[i*3+1] = g0; c[i*3+2] = b0; s[i] = seed; }

    let nx = BOX_N[i*3], ny = BOX_N[i*3+1], nz = BOX_N[i*3+2];

      const tn = nx * ca + nz * sa; nz = -nx * sa + nz * ca; nx = tn;

    b.nr[o] = nx; b.nr[o+1] = ny; b.nr[o+2] = nz;
    b.c[o] = r; b.c[o+1] = gc; b.c[o+2] = bc;

function footprint(o){

    for(let i = 0; i < m; i++){
      const t = -d / 2 + (i + 0.5) * (d / m);
      box(L, 0.9, h, 0.75, c.x + w / 2, my, c.z + t, trimC, 0);
      box(L, 0.9, h, 0.75, c.x - w / 2, my, c.z + t, trimC, 0);
    }
  } else if(style === 3){                            // gothic buttresses
    for(let sx = -1; sx <= 1; sx += 2) for(let sz = -1; sz <= 1; sz += 2){
      box(L, 2.4, h, 2.4, c.x + sx * w / 2, my, c.z + sz * d / 2, trimC, 0);
      box(L, 3.0, 1.1, 3.0, c.x + sx * w / 2, y0 + h - 0.6, c.z + sz * d / 2, shade(trimC, 0.9), 0);
    }
  } else if(style === 4){                            // brick string courses
    const bands = clamp(Math.round(h / 36), 1, 3);
    for(let i = 1; i <= bands; i++)
      box(L, w + 0.6, 0.7, d + 0.6, c.x, y0 + h * i / (bands + 1), c.z, trimC, 0);
  } else if(style === 0 && isHome){                  // modern flats: expression fins
    const fc = shade(base, 0.80);
    for(let i = -1; i <= 1; i += 2){
      box(L, 0.7, h, d * 0.99, c.x + i * w * 0.29, my, c.z, fc, 0);
      box(L, w * 0.99, h, 0.7, c.x, my, c.z + i * d * 0.29, fc, 0);
    }
  }
}

function buildTower(o, L, seedF){
  const T = TYPES[o.type];
  const c = objCentre(o);
  const W = c.w * CELL - 2.8, D = c.d * CELL - 2.8;
  const st = storiesOf(o);
  const H = st * STORY;
  const isHome = T.use === 'home';
  const style = clamp(o.style | 0, 0, 4);
  const tone = 0.92 + (seedF * 7 % 1) * 0.16;
  const base = shade(FACADES[clamp(o.tint | 0, 0, FACADES.length - 1)].c, tone);
  const podColor = shade(base, 0.86);
  const trimC = shade(base, style === 3 ? 0.70 : 0.78);
  const sA = style + 0.012 + seedF * 0.96;          // style + seed, packed for the facade shader

  // podium: homes get a wider 3-4 storey base of shops, cafés and small businesses
  const podFloors = isHome ? (rnd() < 0.5 ? 3 : 4) : 2;
  const podH = Math.min(podFloors, st) * STORY;
  const podOut = isHome ? 3.4 : 1.6;
  const PW = W + podOut, PD = D + podOut;
  box(L, PW, podH, PD, c.x, podH / 2, c.z, podColor, sA);
  box(L, PW + 0.7, 0.55, PD + 0.7, c.x, podH, c.z, shade(podColor, 0.76), 0);
  if(isHome) buildShopfronts(L, c, PW, PD, seedF);

  // shaft
  const segs = style === 2 ? (st > 60 ? 2 : 1)
             : style === 1 ? (st > 60 ? 5 : st > 25 ? 4 : 2)
             : style === 3 ? (st > 40 ? 3 : 2)
             : style === 4 ? (st > 40 ? 3 : 2)
             : (st > 70 ? 4 : st > 34 ? 3 : st > 14 ? 2 : 1);
  const taper = style === 2 ? 0.975 : style === 1 ? 0.875 : style === 3 ? 0.93
              : style === 4 ? 0.955 : (st > 70 ? 0.90 : 0.945);
  const corn = style === 2 ? 0 : style === 1 ? 0.95 : style === 3 ? 0.8 : style === 4 ? 1.05 : 0.5;
  const fr = [];
  let acc = 0;
  for(let i = 0; i < segs; i++){ const v = Math.pow(style === 1 ? 0.66 : 0.72, i); fr.push(v); acc += v; }
  for(let i = 0; i < segs; i++) fr[i] /= acc;

  let yy = podH, w = W, d = D;
  const remain = Math.max(STORY, H - podH);
  for(let i = 0; i < segs; i++){
    const h = remain * fr[i];
    box(L, w, h, d, c.x, yy + h / 2, c.z, base, sA);
    styleDetail(L, style, c, w, d, yy, h, trimC, base, isHome);
    if(corn > 0) box(L, w + 0.8, corn, d + 0.8, c.x, yy + h, c.z, trimC, 0);
    o._capW = w; o._capD = d; o._capY = yy + h;   // the topmost segment as actually drawn
    yy += h;
    w *= taper; d *= taper;
  }

  // crown
  const greenRoof = st <= 30 && (style === 0 || style === 2);
  box(L, w, 0.9, d, c.x, yy + 0.45, c.z, greenRoof ? GREEN_ROOF : GREEN_ROOF2, 0);
  if(style === 1){
    let cw2 = w * 0.86, cd = d * 0.86, cy = yy + 0.9;
    for(let i = 0; i < 3; i++){
      const h = 2.6 + i * 0.6;
      box(L, cw2, h, cd, c.x, cy + h / 2, c.z, trimC, 0);
      cy += h; cw2 *= 0.66; cd *= 0.66;
    }
    cyl(L, 0.35, Math.max(0.9, cw2 * 0.5), 10 + st * 0.09, 8, c.x, cy + 5 + st * 0.045, c.z, shade(trimC, 1.05), 0);
  } else if(style === 2){
    tiltBox(L, w * 1.02, 1.1, d * 1.02, c.x, yy + 2.6, c.z, shade(base, 1.06), 0, 0.20, 0);
    box(L, w * 0.5, 2.2, d * 0.5, c.x, yy + 2.0, c.z, shade(base, 0.9), 0);
    cyl(L, 0.14, 0.4, 12, 5, c.x, yy + 9, c.z, [0.32,0.34,0.36], 0);
  } else if(style === 3){
    for(let sx = -1; sx <= 1; sx += 2) for(let sz = -1; sz <= 1; sz += 2)
      cyl(L, 0.15, 1.5, 9, 4, c.x + sx * w / 2, yy + 5, c.z + sz * d / 2, trimC, 0, Math.PI / 4);
    cyl(L, 0.2, Math.max(1.6, w * 0.28), 13 + st * 0.05, 6, c.x, yy + 7 + st * 0.025, c.z, trimC, 0);
  } else if(style === 4){
    box(L, w + 1.2, 1.6, d + 1.2, c.x, yy + 1.4, c.z, trimC, 0);
    box(L, w * 0.62, 1.9, d * 0.62, c.x, yy + 3.0, c.z, shade(trimC, 0.92), 0);
    cyl(L, 2.0, 2.3, 3.4, 8, c.x + w * 0.2, yy + 6.5, c.z - d * 0.18, [0.45,0.36,0.30], 0);
    for(let i = 0; i < 4; i++){
      const a = Math.PI / 4 + i * Math.PI / 2;
      box(L, 0.3, 3.2, 0.3, c.x + w * 0.2 + Math.cos(a) * 1.7, yy + 3.2, c.z - d * 0.18 + Math.sin(a) * 1.7, [0.4,0.34,0.3], 0);
    }
  } else {
    box(L, w + 0.5, 1.5, d + 0.5, c.x, yy + 0.75, c.z, shade(base, 0.8), 0);
    box(L, w * 0.34, 2.6, d * 0.34, c.x + w * 0.16, yy + 2.2, c.z - d * 0.14, shade(base, 0.72), 0);
    if(st > 40) cyl(L, 0.22, 0.4, 12 + seedF * 14, 5, c.x - w * 0.2, yy + 7 + seedF * 7, c.z + d * 0.2, [0.3,0.32,0.34], 0);
  }
  if(greenRoof){
    const nT = Math.max(2, Math.round(w * d / 90));
    for(let i = 0; i < nT; i++)
      addTree(c.x + rrange(-w/2 + 1.5, w/2 - 1.5), yy + 1.2, c.z + rrange(-d/2 + 1.5, d/2 - 1.5), 0.42 + rnd() * 0.25);
  }
  // entrance canopy + street trees
  box(L, W * 0.42, 0.5, 3.2, c.x, Math.min(podH, 4.4), c.z + PD / 2 + 1.4, shade(base, 0.7), 0);
  const tn = 2 + Math.floor(rnd() * 3);
  for(let i = 0; i < tn; i++){
    const a = rnd() * Math.PI * 2, r = Math.max(PW, PD) / 2 + 2.2 + rnd() * 2;
    addTree(c.x + Math.cos(a) * r, 0, c.z + Math.sin(a) * r, 0.85 + rnd() * 0.5);
  }
}

const SHOP_HUES = [
  [1.00, 0.86, 0.62], [1.00, 0.78, 0.50], [0.98, 0.92, 0.80],
  [0.85, 0.95, 0.92], [1.00, 0.70, 0.58], [0.92, 0.88, 1.00],
];
const AWNING = [
  [0.78, 0.32, 0.26], [0.22, 0.48, 0.44], [0.86, 0.66, 0.28],
  [0.36, 0.42, 0.62], [0.74, 0.74, 0.70],
];
/* Ground-floor retail: glazed bays that read as dark glass by day and glow at night. */
function buildShopfronts(L, c, PW, PD, seedF){
  const y0 = 1.05, y1 = 3.95;
  const sides = [
    {ax:'x', len:PW, nx:0, nz:1, off:PD / 2},
    {ax:'x', len:PW, nx:0, nz:-1, off:PD / 2},
    {ax:'z', len:PD, nx:1, nz:0, off:PW / 2},
    {ax:'z', len:PD, nx:-1, nz:0, off:PW / 2},
  ];
  for(const sd of sides){
    const units = Math.max(2, Math.round(sd.len / 7));
    const uw = sd.len / units;
    for(let i = 0; i < units; i++){
      const t = -sd.len / 2 + (i + 0.5) * uw;
      const px = c.x + (sd.ax === 'x' ? t : sd.nx * sd.off);
      const pz = c.z + (sd.ax === 'x' ? sd.nz * sd.off : t);
      const hue = SHOP_HUES[Math.floor(rnd() * SHOP_HUES.length)];
      const gw = uw * 0.82;
      if(sd.ax === 'x') box(glowParts, gw, y1 - y0, 0.5, px, (y0 + y1) / 2, pz + sd.nz * 0.12, hue, 0);
      else              box(glowParts, 0.5, y1 - y0, gw, px + sd.nx * 0.12, (y0 + y1) / 2, pz, hue, 0);
      // mullions
      const mull = shade(FACADE.warmGrey, 0.5);
      if(sd.ax === 'x') box(L, 0.4, y1 - y0 + 0.5, 0.7, px + gw / 2, (y0 + y1) / 2, pz + sd.nz * 0.1, mull, 0);
      else              box(L, 0.7, y1 - y0 + 0.5, 0.4, px + sd.nx * 0.1, (y0 + y1) / 2, pz + gw / 2, mull, 0);
      if(rnd() < 0.55){
        const aw = AWNING[Math.floor(rnd() * AWNING.length)];
        if(sd.ax === 'x') tiltBox(L, gw, 0.22, 2.0, px, y1 + 0.55, pz + sd.nz * 1.0, aw, 0, sd.nz * 0.30, 0);
        else              tiltBox(L, 2.0, 0.22, gw, px + sd.nx * 1.0, y1 + 0.55, pz, aw, 0, 0, 0);
      }
      if(rnd() < 0.4){
        const sc = SHOP_HUES[Math.floor(rnd() * SHOP_HUES.length)];
        if(sd.ax === 'x') box(glowParts, gw * 0.5, 0.6, 0.22, px, y1 + 1.5, pz + sd.nz * 0.35, sc, 0);
        else              box(glowParts, 0.22, 0.6, gw * 0.5, px + sd.nx * 0.35, y1 + 1.5, pz, sc, 0);
      }
      // pavement café
      if(rnd() < 0.32){
        const ox = px + sd.nx * 2.6, oz = pz + sd.nz * 2.6;
        for(let k = 0; k < 2; k++){
          const tx = ox + rrange(-1.6, 1.6), tz = oz + rrange(-1.6, 1.6);
          cyl(L, 0.55, 0.5, 0.72, 8, tx, 0.36, tz, [0.62, 0.55, 0.46], 0);
          if(rnd() < 0.6){
            const aw = AWNING[Math.floor(rnd() * AWNING.length)];
            cyl(L, 1.5, 0.1, 0.35, 8, tx, 2.35, tz, aw, 0);
            box(L, 0.12, 2.2, 0.12, tx, 1.1, tz, [0.5,0.46,0.42], 0);
          }
        }
      }
    }
  }
}

function buildSpire(o, L, seedF){
  const c = objCentre(o);
  const bronze = [0.62, 0.50, 0.36], dark = [0.42, 0.35, 0.27];
  const H = storiesOf(o) * STORY;
  const R = c.w * CELL * 0.52;
  // four splayed legs
  for(let i = 0; i < 4; i++){
    const a = Math.PI / 4 + i * Math.PI / 2;
    const px = Math.cos(a) * R * 0.62, pz = Math.sin(a) * R * 0.62;
    tiltBox(L, 2.6, H * 0.42, 2.6, c.x + px * 0.62, H * 0.21, c.z + pz * 0.62, bronze, 0, 0, 0);
  }
  cyl(L, R * 0.52, R * 0.95, H * 0.34, 4, c.x, H * 0.17, c.z, bronze, 0, Math.PI / 4);
  box(L, R * 1.5, 1.6, R * 1.5, c.x, H * 0.34, c.z, dark, 0, Math.PI / 4);
  cyl(L, R * 0.30, R * 0.52, H * 0.30, 4, c.x, H * 0.49, c.z, bronze, 0, Math.PI / 4);
  box(L, R * 0.95, 1.4, R * 0.95, c.x, H * 0.64, c.z, dark, 0, Math.PI / 4);
  cyl(L, R * 0.13, R * 0.30, H * 0.26, 4, c.x, H * 0.77, c.z, bronze, 0, Math.PI / 4);
  box(L, R * 0.5, 1.2, R * 0.5, c.x, H * 0.90, c.z, dark, 0, Math.PI / 4);
  cyl(L, 0.6, R * 0.14, H * 0.14, 6, c.x, H * 0.97, c.z, bronze, 0);
  cyl(L, 0.12, 0.5, 16, 5, c.x, H * 1.04 + 8, c.z, dark, 0);
  for(let i = 0; i < 6; i++){
    const a = rnd() * Math.PI * 2, r = R * 1.4 + rnd() * 8;
    addTree(c.x + Math.cos(a) * r, 0, c.z + Math.sin(a) * r, 1.0 + rnd() * 0.4);
  }
}

function buildMega(o, L, seedF){
  const c = objCentre(o);
  const H = storiesOf(o) * STORY;
  const base = FACADES[clamp(o.tint | 0, 0, FACADES.length - 1)].c, alt = FACADE.bone;
  let yy = 0, r = c.w * CELL * 0.46;
  const segs = 6;
  for(let i = 0; i < segs; i++){
    const h = H * (0.26 - i * 0.032);
    const rt = r * (1 - 0.115);
    cyl(L, rt, r, h, 8, c.x, yy + h / 2, c.z, i % 2 ? shade(base, 1.04) : shade(alt, 0.96), 0.31 + i * 0.13, Math.PI / 8);
    yy += h;
    cyl(L, rt * 1.06, rt * 1.06, 1.4, 8, c.x, yy, c.z, shade(base, 0.7), 0, Math.PI / 8);
    r = rt;
  }
  cyl(L, r * 0.15, r * 0.85, H * 0.10, 8, c.x, yy + H * 0.05, c.z, shade(base, 0.9), 0.77, Math.PI / 8);
  cyl(L, 0.2, 1.1, 34, 6, c.x, yy + H * 0.10 + 17, c.z, [0.35,0.37,0.4], 0);
  box(L, c.w * CELL - 1, 7, c.d * CELL - 1, c.x, 3.5, c.z, shade(alt, 0.86), 0);
  for(let i = 0; i < 10; i++){
    const a = rnd() * Math.PI * 2, rr = c.w * CELL * 0.55 + rnd() * 7;
    addTree(c.x + Math.cos(a) * rr, 0, c.z + Math.sin(a) * rr, 0.9 + rnd() * 0.5);
  }
}

function buildArch(o, L, seedF){
  const c = objCentre(o);
  const f = footprint(o);
  const along = f.w >= f.d;
  const span = (along ? f.w : f.d) * CELL - 3;
  const H = storiesOf(o) * STORY * 0.9;
  const col = FACADES[clamp(o.tint | 0, 0, FACADES.length - 1)].c;
  const N = 26;
  for(let i = 0; i < N; i++){
    const t0 = i / N, t1 = (i + 1) / N;
    const px = (t0 - 0.5) * span, py = Math.sin(t0 * Math.PI) * H;
    const qx = (t1 - 0.5) * span, qy = Math.sin(t1 * Math.PI) * H;
    const mx = (px + qx) / 2, my = (py + qy) / 2;
    const len = Math.hypot(qx - px, qy - py) * 1.16;
    const ang = Math.atan2(qy - py, qx - px);
    const th = lerp(6.5, 2.6, Math.sin(t0 * Math.PI));
    const g = new THREE.BoxGeometry(len, th, th);
    g.rotateZ(ang);
    if(!along) g.rotateY(Math.PI / 2);
    g.translate(c.x + (along ? mx : 0), my, c.z + (along ? 0 : mx));
    L.geo.push(attach(g, col, 0));
  }
  slab(L, f.w * CELL - 1, f.d * CELL - 1, c.x, 0.08, c.z, [0.78,0.74,0.68]);
  for(let i = 0; i < 6; i++){
    const a = rnd() * Math.PI * 2, r = span * 0.4 + rnd() * 10;
    addTree(c.x + Math.cos(a) * r, 0, c.z + Math.sin(a) * r, 0.9 + rnd() * 0.4);
  }
}

/* One marked-out pitch. Long axis follows the longer side. */
function drawPitch(L, cx, cz, w, d, sport){
  const horiz = w >= d;
  const LN = [0.94, 0.95, 0.93];
  const y = 0.13;
  const rect = (ww, dd, t) => {
    slab(L, ww, t, cx, y, cz - dd / 2, LN); slab(L, ww, t, cx, y, cz + dd / 2, LN);
    slab(L, t, dd, cx - ww / 2, y, cz, LN); slab(L, t, dd, cx + ww / 2, y, cz, LN);
  };
  if(sport === 1){                                   // tennis
    slab(L, w, d, cx, 0.09, cz, [0.34, 0.46, 0.38]);
    const cw = w * 0.74, cd = d * 0.74;
    slab(L, cw, cd, cx, 0.11, cz, [0.30, 0.46, 0.60]);
    rect(cw * 0.94, cd * 0.94, 0.35);
    if(horiz){
      slab(L, 0.35, cd * 0.94, cx, y, cz, LN);
      slab(L, cw * 0.5, 0.3, cx, y, cz - cd * 0.24, LN);
      slab(L, cw * 0.5, 0.3, cx, y, cz + cd * 0.24, LN);
      box(L, 0.24, 1.1, cd * 0.98, cx, 0.55, cz, [0.22,0.24,0.26], 0);
    } else {
      slab(L, cw * 0.94, 0.35, cx, y, cz, LN);
      slab(L, 0.3, cd * 0.5, cx - cw * 0.24, y, cz, LN);
      slab(L, 0.3, cd * 0.5, cx + cw * 0.24, y, cz, LN);
      box(L, cw * 0.98, 1.1, 0.24, cx, 0.55, cz, [0.22,0.24,0.26], 0);
    }
  } else if(sport === 2){                            // basketball
    slab(L, w, d, cx, 0.09, cz, [0.40, 0.44, 0.48]);
    const cw = w * 0.86, cd = d * 0.86;
    slab(L, cw, cd, cx, 0.11, cz, [0.66, 0.40, 0.30]);
    rect(cw * 0.94, cd * 0.94, 0.3);
    disc(L, Math.min(cw, cd) * 0.15, cx, y, cz, LN, 18);
    disc(L, Math.min(cw, cd) * 0.13, cx, y + 0.01, cz, [0.66, 0.40, 0.30], 18);
    for(let s2 = -1; s2 <= 1; s2 += 2){
      const px = horiz ? cx + s2 * cw * 0.44 : cx;
      const pz = horiz ? cz : cz + s2 * cd * 0.44;
      box(L, 0.28, 3.3, 0.28, px, 1.65, pz, [0.30,0.32,0.34], 0);
      box(L, horiz ? 0.24 : 1.7, 1.0, horiz ? 1.7 : 0.24, px - (horiz ? s2 * 1.1 : 0), 3.4, pz - (horiz ? 0 : s2 * 1.1), [0.95,0.95,0.92], 0);
    }
  } else {                                           // soccer
    slab(L, w, d, cx, 0.09, cz, shade(LAWN2, 1.06));
    const cw = w * 0.9, cd = d * 0.9;
    rect(cw, cd, 0.4);
    disc(L, Math.min(cw, cd) * 0.16, cx, y, cz, LN, 20);
    disc(L, Math.min(cw, cd) * 0.14, cx, y + 0.01, cz, shade(LAWN2, 1.06), 20);
    if(horiz) slab(L, 0.4, cd, cx, y, cz, LN); else slab(L, cw, 0.4, cx, y, cz, LN);
    for(let s2 = -1; s2 <= 1; s2 += 2){
      const gx2 = horiz ? cx + s2 * cw * 0.5 : cx;
      const gz2 = horiz ? cz : cz + s2 * cd * 0.5;
      const bw = horiz ? cw * 0.11 : cw * 0.34, bd = horiz ? cd * 0.34 : cd * 0.11;
      slab(L, bw, 0.4, gx2 - (horiz ? s2 * bw / 2 : 0), y, gz2 - (horiz ? 0 : s2 * bd / 2) - (horiz ? bd / 2 : 0), LN);
      box(L, horiz ? 0.3 : 7.0, 2.4, horiz ? 7.0 : 0.3, gx2, 1.2, gz2, [0.95,0.95,0.93], 0);
    }
  }
}

function buildStadium(o, L, seedF){
  const c = objCentre(o), f = footprint(o);
  const W = f.w * CELL - 3, D = f.d * CELL - 3;
  const st = storiesOf(o);
  const H = Math.max(9, st * STORY * 0.62);
  const shell = FACADES[clamp(o.tint | 0, 0, FACADES.length - 1)].c;
  const rx = W / 2, rz = D / 2;
  const rr = Math.min(rx, rz);
  o._capW = W; o._capD = D; o._capY = H * 1.02;
  slab(L, W, D, c.x, 0.05, c.z, [0.56, 0.55, 0.52]);
  drawPitch(L, c.x, c.z, W * 0.56, D * 0.56, o.sport | 0);
  const N = 30;
  const seg = 2 * Math.PI * Math.sqrt((rx * rx + rz * rz) / 2) / N * 1.32;
  for(let i = 0; i < N; i++){
    const a = (i + 0.5) / N * Math.PI * 2;
    const ca = Math.cos(a), sa = Math.sin(a), ry = -(a + Math.PI / 2);
    box(L, seg, H * 0.52, rr * 0.26, c.x + ca * rx * 0.78, H * 0.26, c.z + sa * rz * 0.78, shade(shell, 0.88), 0, ry);
    box(L, seg, H * 0.55, rr * 0.20, c.x + ca * rx * 0.94, H * 0.60, c.z + sa * rz * 0.94, shell, 0, ry);
    tiltBox(L, seg, 0.55, rr * 0.34, c.x + ca * rx * 0.86, H * 1.03, c.z + sa * rz * 0.86, shade(shell, 1.06), 0, 0.13, ry);
    if(i % 3 === 0) box(L, seg * 0.3, H * 0.9, rr * 0.1, c.x + ca * rx * 1.02, H * 0.45, c.z + sa * rz * 1.02, shade(shell, 0.72), 0, ry);
    if(i % 5 === 0) box(glowParts, seg * 0.5, 1.3, 0.5, c.x + ca * rx * 1.03, H * 0.14, c.z + sa * rz * 1.03, [1.0, 0.85, 0.6], 0, ry);
  }
  for(let i = 0; i < 4; i++){
    const a = Math.PI / 4 + i * Math.PI / 2;
    const px = c.x + Math.cos(a) * rx * 0.99, pz = c.z + Math.sin(a) * rz * 0.99;
    box(L, 0.9, H * 1.5, 0.9, px, H * 0.75, pz, [0.42, 0.44, 0.46], 0);
    box(L, 4.2, 1.4, 1.2, px, H * 1.5, pz, [0.35, 0.37, 0.40], 0, -a);
    box(glowParts, 3.8, 1.0, 0.9, px, H * 1.5, pz, [1.0, 0.97, 0.88], 0, -a);
  }
  for(let i = 0; i < 10; i++){
    const a = rnd() * Math.PI * 2;
    addTree(c.x + Math.cos(a) * (rx + 3.5), 0, c.z + Math.sin(a) * (rz + 3.5), 0.9 + rnd() * 0.4);
  }
}

function buildMall(o, L, seedF){
  const c = objCentre(o), f = footprint(o);
  const W = f.w * CELL - 2.6, D = f.d * CELL - 2.6;
  const st = storiesOf(o), H = st * STORY;
  const shell = FACADES[clamp(o.tint | 0, 0, FACADES.length - 1)].c;
  const sA = clamp(o.style | 0, 0, 4) + 0.02 + seedF * 0.96;
  o._capW = W; o._capD = D; o._capY = H;
  box(L, W, H, D, c.x, H / 2, c.z, shade(shell, 0.97), sA);
  box(L, W + 1.4, 1.2, D + 1.4, c.x, H, c.z, shade(shell, 0.8), 0);
  box(L, W + 0.6, 0.8, D + 0.6, c.x, H + 1.2, c.z, shade(shell, 0.9), 0);
  buildShopfronts(L, c, W, D, seedF);
  // glazed atrium strips and roof lanterns
  for(let s2 = -1; s2 <= 1; s2 += 2){
    box(glowParts, W * 0.22, H * 0.62, 0.5, c.x, H * 0.52, c.z + s2 * (D / 2 + 0.1), [1.0, 0.92, 0.76], 0);
    box(L, W * 0.34, 0.6, 4.0, c.x, 5.2, c.z + s2 * (D / 2 + 1.9), shade(shell, 0.72), 0);
  }
  const lanterns = clamp(Math.round(W / 14), 1, 5);
  for(let i = 0; i < lanterns; i++){
    const lx = c.x - W / 2 + (i + 0.5) * (W / lanterns);
    tiltBox(L, W / lanterns * 0.5, 0.5, D * 0.3, lx, H + 2.4, c.z, [0.75, 0.85, 0.88], 0, 0.16, 0);
    box(glowParts, W / lanterns * 0.44, 0.9, D * 0.26, lx, H + 1.9, c.z, [1.0, 0.94, 0.8], 0);
  }
  for(let i = 0; i < Math.round(W * D / 260); i++)
    addTree(c.x + rrange(-W / 2 + 3, W / 2 - 3), H + 1.9, c.z + rrange(-D / 2 + 3, D / 2 - 3), 0.5 + rnd() * 0.3);
  for(let i = 0; i < 8; i++){
    const a = rnd() * Math.PI * 2;
    addTree(c.x + Math.cos(a) * (W / 2 + 3), 0, c.z + Math.sin(a) * (D / 2 + 3), 0.85 + rnd() * 0.4);
  }
}

function buildFactory(o, L, seedF){
  const c = objCentre(o), f = footprint(o);
  const W = f.w * CELL - 2.6, D = f.d * CELL - 2.6;
  const H = Math.max(7, storiesOf(o) * STORY);
  const shell = [0.735, 0.725, 0.695];
  const trim = [0.50, 0.52, 0.55];
  const along = W >= D;
  o._capW = W; o._capD = D; o._capY = H;
  box(L, W, H, D, c.x, H / 2, c.z, shell, 0);
  box(L, W + 0.8, 0.7, D + 0.8, c.x, H, c.z, trim, 0);
  // sawtooth roof
  const n = clamp(Math.round((along ? W : D) / 11), 2, 12);
  const span = (along ? W : D) / n;
  for(let i = 0; i < n; i++){
    const t = -(along ? W : D) / 2 + (i + 0.5) * span;
    const px = along ? c.x + t : c.x, pz = along ? c.z : c.z + t;
    if(along){
      tiltBox(L, span * 0.98, 0.5, D * 0.98, px, H + 1.5, pz, shade(shell, 1.04), 0, 0.34, 0);
      box(glowParts, span * 0.5, 1.7, D * 0.96, px + span * 0.26, H + 1.4, pz, [0.80, 0.90, 1.0], 0);
    } else {
      tiltBox(L, W * 0.98, 0.5, span * 0.98, px, H + 1.5, pz, shade(shell, 1.04), 0, 0, 0);
      box(glowParts, W * 0.96, 1.7, span * 0.5, px, H + 1.4, pz + span * 0.26, [0.80, 0.90, 1.0], 0);
    }
  }
  // loading bays along one long side
  const bays = clamp(Math.round((along ? W : D) / 9), 2, 10);
  for(let i = 0; i < bays; i++){
    const t = -(along ? W : D) / 2 + (i + 0.5) * ((along ? W : D) / bays);
    const px = along ? c.x + t : c.x + W / 2;
    const pz = along ? c.z + D / 2 : c.z + t;
    box(L, along ? 4.2 : 0.6, 4.4, along ? 0.6 : 4.2, px, 2.2, pz, trim, 0);
    box(L, along ? 5.4 : 2.6, 0.4, along ? 2.6 : 5.4, px, 5.0, pz + (along ? 1.2 : 0) - 0, shade(trim, 1.2), 0);
  }
  // chimneys and vents
  for(let i = 0; i < 2; i++){
    const px = c.x + (i ? W * 0.3 : -W * 0.3), pz = c.z - D * 0.28;
    cyl(L, 1.5, 1.9, H * 0.9 + 9, 8, px, H / 2 + (H * 0.9 + 9) / 2, pz, [0.78, 0.76, 0.72], 0);
    cyl(L, 2.1, 1.7, 1.2, 8, px, H + (H * 0.9 + 9) / 2 - 0.6, pz, trim, 0);
  }
  // office annex, which does get windows
  const ow = Math.min(W * 0.3, 16), oh = Math.max(H, 11);
  box(L, ow, oh, Math.min(D * 0.5, 14), c.x - W / 2 + ow / 2, oh / 2, c.z - D / 2 + Math.min(D * 0.5, 14) / 2,
      shade(FACADES[5].c, 0.98), 0.02 + seedF * 0.96);
  for(let i = 0; i < 6; i++){
    const a = rnd() * Math.PI * 2;
    addTree(c.x + Math.cos(a) * (W / 2 + 3), 0, c.z + Math.sin(a) * (D / 2 + 3), 0.85 + rnd() * 0.45);
  }
}

function disc(list, r, x, y, z, color, seg){
  const g = new THREE.CircleGeometry(r, seg || 18).rotateX(-Math.PI / 2);
  g.translate(x, y, z);
  list.geo.push(attach(g, color, 0));
}

const TRAM_LAT = 2.35;
const PAVE   = [0.760, 0.735, 0.690];
const PAVE2  = [0.815, 0.790, 0.740];
const BIKE   = [0.235, 0.520, 0.470];
const WALKC  = [0.845, 0.805, 0.735];
const LAWN   = [0.330, 0.505, 0.255];
const LAWN2  = [0.290, 0.465, 0.235];
const WOOD   = [0.600, 0.470, 0.340];
const RAIL   = [0.300, 0.300, 0.320];

function buildGreen(o, L){
  const c = objCentre(o), f = footprint(o);
  const W = f.w * CELL - 1.6, D = f.d * CELL - 1.6;
  switch(o.type){
    case 'park': {
      slab(L, W, D, c.x, 0.07, c.z, LAWN);
      slab(L, W * 0.16, D, c.x, 0.10, c.z, shade(PAVE2, 1.0));
      slab(L, W, D * 0.16, c.x, 0.10, c.z, shade(PAVE2, 1.0));
      if(f.w >= 4 && f.d >= 4){
        disc(L, Math.min(W, D) * 0.22, c.x + W * 0.22, 0.12, c.z - D * 0.2, [0.16,0.40,0.44], 24);
        box(L, 3.2, 1.0, 3.2, c.x - W * 0.26, 0.5, c.z + D * 0.24, PAVE2, 0);
      }
      const n = Math.round(W * D / 42);
      for(let i = 0; i < n; i++){
        const px = c.x + rrange(-W/2 + 2, W/2 - 2), pz = c.z + rrange(-D/2 + 2, D/2 - 2);
        if(Math.abs(px - c.x) < W * 0.09 || Math.abs(pz - c.z) < D * 0.09) continue;
        addTree(px, 0.05, pz, 0.9 + rnd() * 0.75);
      }
      for(let i = 0; i < 4; i++)
        box(L, 2.4, 0.5, 0.8, c.x + rrange(-W/2+3, W/2-3), 0.55, c.z + rrange(-D/2+3, D/2-3), WOOD, 0, rnd()*3);
      break;
    }
    case 'sports': {
      const sport = o.sport | 0;
      const tile = sport === 1 ? [15, 27] : sport === 2 ? [18, 17] : [36, 24];
      const fitN = (tw, th) => Math.max(1, Math.floor(W / tw)) * Math.max(1, Math.floor(D / th));
      const swap = fitN(tile[1], tile[0]) > fitN(tile[0], tile[1]);
      const tw = swap ? tile[1] : tile[0], th = swap ? tile[0] : tile[1];
      const cols = Math.max(1, Math.floor(W / tw)), rows = Math.max(1, Math.floor(D / th));
      const cw = W / cols, ch = D / rows;
      slab(L, W, D, c.x, 0.07, c.z, LAWN2);
      for(let i = 0; i < cols; i++) for(let j = 0; j < rows; j++)
        drawPitch(L, c.x - W/2 + (i + 0.5) * cw, c.z - D/2 + (j + 0.5) * ch, cw * 0.93, ch * 0.93, sport);
      for(let i = 0; i < 4 + cols * rows; i++)
        addTree(c.x + rrange(-W/2, W/2), 0.05, c.z + (rnd() < 0.5 ? -1 : 1) * (D/2 + 1.5), 0.85 + rnd()*0.4);
      for(let i = 0; i < 2; i++)
        box(L, 3.0, 0.5, 1.0, c.x + rrange(-W/2+3, W/2-3), 0.6, c.z + (rnd()<0.5?-1:1)*(D/2 - 1), WOOD, 0);
      if(cols * rows > 1){
        for(let s2 = -1; s2 <= 1; s2 += 2){
          box(L, 0.7, 12, 0.7, c.x + s2 * (W/2 - 1), 6, c.z, [0.42,0.44,0.46], 0);
          box(glowParts, 2.6, 0.8, 1.0, c.x + s2 * (W/2 - 1), 12.2, c.z, [1.0,0.97,0.88], 0);
        }
      }
      break;
    }
    case 'forest': {
      const n = Math.min(1100, Math.round(W * D * 0.036));
      const clearings = [];
      for(let i = 0; i < 2 + Math.floor(rnd() * 2); i++)
        clearings.push([c.x + rrange(-W/2, W/2), c.z + rrange(-D/2, D/2), 7 + rnd() * 11]);
      for(let i = 0; i < n; i++){
        const px = c.x + rrange(-W/2 + 1, W/2 - 1), pz = c.z + rrange(-D/2 + 1, D/2 - 1);
        let skip = false;
        for(const [qx, qz, qr] of clearings) if((px-qx)**2 + (pz-qz)**2 < qr*qr){ skip = true; break; }
        if(skip) continue;
        const [gx2, gz2] = cellFromWorld(px, pz);
        if(gx2 >= 0 && gz2 >= 0 && gx2 < GRID && gz2 < GRID && occT[oi(gx2, gz2)] !== -1) continue;
        const dark = 0.72 + rnd() * 0.4;
        addTree(px, 0.02, pz, 0.85 + rnd() * 1.05,
                [0.16 * dark, (0.30 + rnd() * 0.16) * dark, 0.15 * dark]);
      }
      for(const [qx, qz, qr] of clearings){
        if(rnd() < 0.5) box(L, 2.4, 0.5, 0.85, qx, 0.55, qz, WOOD, 0, rnd() * 3);
      }
      break;
    }
    case 'plaza': {
      slab(L, W, D, c.x, 0.07, c.z, PAVE2);
      disc(L, Math.min(W,D) * 0.26, c.x, 0.10, c.z, shade(PAVE, 0.94), 22);
      cyl(L, Math.min(W,D)*0.15, Math.min(W,D)*0.17, 1.1, 18, c.x, 0.55, c.z, PAVE, 0);
      disc(L, Math.min(W,D)*0.13, c.x, 1.14, c.z, [0.24,0.52,0.55], 20);
      for(let i = 0; i < 4; i++){
        const a = i * Math.PI / 2 + 0.4;
        addTree(c.x + Math.cos(a) * W * 0.36, 0.05, c.z + Math.sin(a) * D * 0.36, 0.95 + rnd()*0.3);
        box(L, 2.2, 0.45, 0.7, c.x + Math.cos(a) * W * 0.22, 0.5, c.z + Math.sin(a) * D * 0.22, WOOD, 0, a);
      }
      lamps.push({x: c.x + W*0.3, z: c.z - D*0.3});
      break;
    }
    case 'lake': {
      const r = Math.min(W, D) * 0.47;
      slab(L, W + 2, D + 2, c.x, 0.06, c.z, LAWN);
      disc(L, r + 2.2, c.x, 0.10, c.z, [0.845, 0.795, 0.665], 30);
      disc(lakeParts, r, c.x, 0.17, c.z, [0.16, 0.44, 0.46], 34);
      for(let i = 0; i < 14; i++){
        const a = rnd() * Math.PI * 2, rr = r + 3 + rnd() * 6;
        addTree(c.x + Math.cos(a) * rr, 0.05, c.z + Math.sin(a) * rr, 1.0 + rnd() * 0.6);
      }
      for(let i = 0; i < 3; i++){
        const a = rnd() * Math.PI * 2;
        box(L, 2.4, 0.5, 0.8, c.x + Math.cos(a) * (r + 2.6), 0.6, c.z + Math.sin(a) * (r + 2.6), WOOD, 0, a);
      }
      break;
    }
    case 'prom': {
      slab(L, W, D + 2, c.x, 0.09, c.z, WOOD);
      for(let i = -3; i <= 3; i++)
        box(L, W, 0.06, 0.5, c.x, 0.13, c.z + i * (D + 2) / 7, shade(WOOD, 0.86), 0);
      const zr = c.z + (D + 2) / 2 - 0.3;
      box(L, W, 0.25, 0.25, c.x, 1.15, zr, RAIL, 0);
      for(let i = 0; i <= 6; i++) box(L, 0.25, 1.2, 0.25, c.x - W/2 + i * W/6, 0.6, zr, RAIL, 0);
      for(let i = 0; i < 3; i++){
        addTree(c.x - W/2 + (i + 0.5) * W/3, 0.08, c.z - (D + 2)/2 - 1.6, 0.9 + rnd()*0.35);
        box(L, 2.2, 0.45, 0.8, c.x - W/2 + (i + 0.5) * W/3, 0.6, c.z + 1.2, WOOD, 0);
      }
      lamps.push({x: c.x, z: c.z - 1});
      break;
    }
  }
}

function cellAxis(gx, gz){
  const sx = isStreetIdx(gx), sz = isStreetIdx(gz);
  if(sx && sz) return 'both';
  if(sx) return 'z';
  if(sz) return 'x';
  return 'x';
}

/* Green track: rails set into a grass bed, the way a car-free city would build it. */
const RAIL_STEEL = [0.42, 0.42, 0.45];
const TRACK_GRASS = [0.315, 0.470, 0.245];
function tramCell(L, gx, gz, doX, doZ){
  const x = wx(gx), z = wz(gz);
  const h = ((gx * 31 + gz * 17) % 7) / 7;
  const bed = shade(TRACK_GRASS, 0.9 + h * 0.22);
  if(doX){
    slab(L, CELL + 0.1, 8.2, x, 0.10, z, bed);
    slab(L, CELL + 0.1, 1.5, x, 0.13, z, shade(bed, 1.14));
    for(const t of [-TRAM_LAT, TRAM_LAT]){
      for(const r of [-0.72, 0.72]) box(L, CELL + 0.1, 0.20, 0.26, x, 0.20, z + t + r, RAIL_STEEL, 0);
      slab(L, CELL + 0.1, 1.2, x, 0.12, z + t, shade(bed, 0.86));
    }
  }
  if(doZ){
    slab(L, 8.2, CELL + 0.1, x, 0.10, z, bed);
    slab(L, 1.5, CELL + 0.1, x, 0.13, z, shade(bed, 1.14));
    for(const t of [-TRAM_LAT, TRAM_LAT]){
      for(const r of [-0.72, 0.72]) box(L, 0.26, 0.20, CELL + 0.1, x + t + r, 0.20, z, RAIL_STEEL, 0);
      slab(L, 1.2, CELL + 0.1, x + t, 0.12, z, shade(bed, 0.86));
    }
  }
  // tufts growing between and beside the rails
  for(let i = 0; i < 5; i++){
    const q = ((gx * 7 + gz * 13 + i * 29) % 100) / 100;
    const q2 = ((gx * 19 + gz * 5 + i * 47) % 100) / 100;
    const a = (q - 0.5) * (CELL - 1), b = (q2 - 0.5) * 7.4;
    const tx = doX ? x + a : x + b, tz = doX ? z + b : z + a;
    const sc = 0.35 + q * 0.4;
    box(L, sc, 0.5 + q2 * 0.5, sc, tx, 0.3, tz, shade(TRACK_GRASS, 1.0 + q2 * 0.3), 0, q * 3);
  }
}
/* Lay track along every street cell a tram line passes through. */
function buildTramTracks(L){
  const done = new Set();
  for(const path of (G.tramPaths || [])){
    for(const c of (path.cells || [])){
      const key = c.gx + ',' + c.gz;
      if(done.has(key)) continue;
      done.add(key);
      tramCell(L, c.gx, c.gz, c.x, c.z);
    }
  }
}

function buildTransit(o, L){
  const x = wx(o.gx), z = wz(o.gz);
  const ax = cellAxis(o.gx, o.gz);
  const doX = ax === 'x' || ax === 'both', doZ = ax === 'z' || ax === 'both';
  switch(o.type){
    case 'tram': { tramCell(L, x, z, doX, doZ); break; }
    case 'tramstop': {
      const along = ((o.rot | 0) & 1) === 0;
      const PL = [0.72, 0.70, 0.66], EDGE = [0.88, 0.72, 0.30];
      const off = TRAM_LAT + 2.0;
      const sx2 = along ? x : x + off, sz2 = along ? z + off : z;
      const pw = along ? 6.4 : 2.8, pd = along ? 2.8 : 6.4;
      box(L, pw, 0.4, pd, sx2, 0.24, sz2, PL, 0);
      box(L, along ? pw : 0.22, 0.12, along ? 0.22 : pd,
          sx2 - (along ? 0 : 1.3), 0.5, sz2 - (along ? 1.3 : 0), EDGE, 0);
      for(const q of [-1, 1])
        box(L, 0.2, 2.9, 0.2, sx2 + (along ? q * 2.5 : 0.9), 1.85, sz2 + (along ? 0.9 : q * 2.5), [0.36,0.38,0.40], 0);
      box(L, along ? 5.6 : 2.4, 0.24, along ? 2.4 : 5.6, sx2 + (along ? 0 : 0.5), 3.35, sz2 + (along ? 0.5 : 0), [0.62,0.66,0.68], 0);
      box(L, 0.18, 4.2, 0.18, sx2 + (along ? -3.4 : 0), 2.4, sz2 + (along ? 0 : -3.4), [0.36,0.38,0.40], 0);
      o._signX = sx2 + (along ? -3.4 : 0); o._signZ = sz2 + (along ? 0 : -3.4);
      lamps.push({x: sx2, z: sz2});
      break;
    }
    case 'bike': {
      if(doX) slab(L, CELL, 4.4, x, 0.13, z, BIKE);
      if(doZ) slab(L, 4.4, CELL, x, 0.13, z, BIKE);
      if(doX) for(let i=0;i<3;i++) box(L, 1.5, 0.03, 0.22, x - CELL/2 + (i+0.5)*CELL/3, 0.16, z, [0.9,0.95,0.92], 0);
      if(doZ) for(let i=0;i<3;i++) box(L, 0.22, 0.03, 1.5, x, 0.16, z - CELL/2 + (i+0.5)*CELL/3, [0.9,0.95,0.92], 0);
      break;
    }
    case 'walk': {
      if(doX) slab(L, CELL, 6.0, x, 0.11, z, WALKC);
      if(doZ) slab(L, 6.0, CELL, x, 0.11, z, WALKC);
      if(rnd() < 0.5) addTree(x + rrange(-2,2), 0.08, z + rrange(-2,2), 0.8 + rnd()*0.3);
      break;
    }
    case 'subway': {
      const r = (o.rot | 0) & 3;
      const ry = r * Math.PI / 2;
      const rot2 = (dx, dz) => [x + dx * Math.cos(ry) + dz * Math.sin(ry), z - dx * Math.sin(ry) + dz * Math.cos(ry)];
      slab(L, CELL - 0.5, CELL - 0.5, x, 0.14, z, PAVE2);
      box(L, 5.4, 0.6, 4.2, x, 0.4, z, [0.30,0.34,0.46], 0, ry);
      for(let i = 0; i < 4; i++){
        const [px, pz] = rot2(0, -1.5 + i * 0.9);
        box(L, 5.0, 0.35, 0.9, px, 0.75 + i * 0.3, pz, [0.44,0.48,0.60], 0, ry);
      }
      box(L, 5.8, 0.35, 4.8, x, 3.5, z, [0.55,0.72,0.80], 0, ry);
      for(const sgn of [-2.4, 2.4]){
        const [px, pz] = rot2(sgn, 2.0);
        box(L, 0.3, 3.4, 0.3, px, 1.7, pz, RAIL, 0, ry);
      }
      const [sx3, sz3] = rot2(3.4, 0);
      box(L, 0.28, 3.6, 0.28, sx3, 1.8, sz3, RAIL, 0, ry);
      box(L, 1.9, 1.1, 0.16, sx3, 3.9, sz3, [0.42,0.48,0.95], 0, ry);
      o._signX = sx3; o._signZ = sz3; o._signR = ry;
      lamps.push({x: sx3, z: sz3});

    }
  }
}

/* Street surfacing follows development: paved where buildings are, soft
   footpaths where the block is parkland, untouched countryside elsewhere. */
function buildStreets(L){
  const R = 2;
  for(let gx = 1; gx < GRID - 1; gx++){
    for(let gz = 1; gz < GRID - 1; gz++){
      const sx = isStreetIdx(gx), sz = isStreetIdx(gz);
      if(!sx && !sz) continue;
      const x = wx(gx), z = wz(gz);
      if(shoreZ(x) - z < 16) continue;
      let built = false, green = false;
      const here = occ[oi(gx, gz)];
      if(here !== -1){
        const ho = state.objects[here];
        if(ho && TYPES[ho.type].spans) continue;          // a superblock covers this street
        built = true;                                     // transit sitting on this cell
      }
      for(let dx = -R; dx <= R && !built; dx++) for(let dz = -R; dz <= R; dz++){
        const ax = gx + dx, az = gz + dz;
        if(ax < 0 || az < 0 || ax >= GRID || az >= GRID) continue;
        const idx = occ[oi(ax, az)];
        if(idx === -1) continue;
        const ob = state.objects[idx];
        if(!ob) continue;
        const k = TYPES[ob.type].kind;
        if(k === 'green') green = true; else { built = true; break; }
      }
      if(!built && !green) continue;

      if(built){
        slab(L, CELL + 0.05, CELL + 0.05, x, 0.04, z, (sx && sz) ? PAVE2 : PAVE);
        if(sx !== sz){
          if((gx + gz) % 3 === 0){
            const off = 3.3;
            if(sx){ addTree(x - off, 0.03, z + rrange(-2.5,2.5), 0.85 + rnd()*0.45);
                    addTree(x + off, 0.03, z + rrange(-2.5,2.5), 0.85 + rnd()*0.45); }
            else  { addTree(x + rrange(-2.5,2.5), 0.03, z - off, 0.85 + rnd()*0.45);
                    addTree(x + rrange(-2.5,2.5), 0.03, z + off, 0.85 + rnd()*0.45); }
          }
          if((gx + gz) % 5 === 0) lamps.push({x: x + (sx ? 3.6 : 0), z: z + (sz ? 3.6 : 0)});
        }
      } else {
        // parkland: a meandering footpath instead of a street
        const w = 3.1;
        if(sx && sz) slab(L, w, w, x, 0.05, z, WALKC);
        else if(sx) slab(L, w, CELL + 0.05, x + Math.sin(gz * 1.7) * 1.1, 0.05, z, WALKC);
        else slab(L, CELL + 0.05, w, x, 0.05, z + Math.sin(gx * 1.7) * 1.1, WALKC);
        if((gx * 7 + gz) % 4 === 0)
          addTree(x + rrange(-3.6, 3.6), 0.03, z + rrange(-3.6, 3.6), 0.9 + rnd() * 0.6);
        if((gx + gz) % 11 === 0) lamps.push({x, z});
      }
    }
  }
}

const state = {
  mode: 'view', tool: null, speed: 1, hour: 7.2, simTime: 7.2, seed: 1, metro: false, size: 2,
  objects: [], lines: [], selected: -1, selLine: -1, population: 0, jobs: 0,

let uidSeq = 1;
/* properties chosen in the inspector stick around per type */
const toolMem = {};
function toolSpec(type){
  if(!type || !TYPES[type]) return null;
  if(!toolMem[type]) toolMem[type] = defaultSpec(type);
  return toolMem[type];
}
let occ = new Int32Array(GRID * GRID).fill(-1);     // ground layer
let occT = new Int32Array(GRID * GRID).fill(-1);    // things sitting on a host
const oi = (gx, gz) => gx * GRID + gz;
const layerOf = o => (o && o.lvl) ? occT : occ;
/* Hosts carry another object: a mall carries towers, a forest carries paths. */
function hostAccepts(host, type){
  const H = TYPES[host.type];
  if(!H || !H.hosts) return false;
  const K = TYPES[type];
  if(!K) return false;
  return H.hosts === K.kind || (H.hosts === 'building' && K.kind === 'landmark');
}
function hostLift(h){
  if(!h) return 0;
  return TYPES[h.type].hosts === 'building' ? storiesOf(h) * STORY + 1.3 : 0;
}
/* Which layer would this placement land on, and on top of what? */
function layerFor(spec, gx, gz, rot){
  const type = tdims(spec)[2];
  const cells = cellsOf(spec, gx, gz, rot);
  let host = null;
  for(const [cx, cz] of cells){
    if(cx < 0 || cz < 0 || cx >= GRID || cz >= GRID) return {lvl:0, host:null};
    const idx = occ[oi(cx, cz)];
    const ob = idx === -1 ? null : state.objects[idx];
    if(!ob || !hostAccepts(ob, type)) return {lvl:0, host:null};
    if(host && ob !== host) return {lvl:0, host:null};
    host = ob;
  }
  return host ? {lvl:1, host} : {lvl:0, host:null};
}

/* A "spec" is either a bare type name or {type, w, d, stories, tint}. */
function tdims(spec){
  const type = typeof spec === 'string' ? spec : (spec && spec.type);
  const T = TYPES[type];
  if(!T) return [1, 1, type];
  if(typeof spec === 'string') return [T.w, T.d, type];
  return [spec.w || T.w, spec.d || T.d, type];
}
function cellsOf(spec, gx, gz, rot){
  const [w0, d0] = tdims(spec);
  const r = (rot | 0) & 3;
  const w = (r % 2) ? d0 : w0, d = (r % 2) ? w0 : d0;
  const out = [];
  for(let i = 0; i < w; i++) for(let j = 0; j < d; j++) out.push([gx + i, gz + j]);
  return out;
}
function validCell(type, gx, gz, onHost){
  if(gx < 1 || gz < 1 || gx >= GRID - 1 || gz >= GRID - 1) return false;
  const x = wx(gx), z = wz(gz), d = shoreZ(x) - z;
  const T = TYPES[type];
  if(T.kind === 'transit') return (isStreetIdx(gx) || isStreetIdx(gz)) && d > 16;
  if(type === 'prom') return d > 9 && d < 40;
  if(T.spans || onHost) return d > 22;                   // superblocks and rooftops cross streets
  if(isStreetIdx(gx) || isStreetIdx(gz)) return false;   // keep the street grid clear
  return d > 22;
}
/* Terrain/street legality only — existing objects are replaced, not blocking. */
function fits(spec, gx, gz, rot){
  const type = tdims(spec)[2];
  const onHost = layerFor(spec, gx, gz, rot).lvl === 1;
  for(const [cx, cz] of cellsOf(spec, gx, gz, rot)) if(!validCell(type, cx, cz, onHost)) return false;

}
function canPlace(spec, gx, gz, rot, ignore){
  const type = tdims(spec)[2];
  const cs = cellsOf(spec, gx, gz, rot);
  const onHost = layerFor(spec, gx, gz, rot).lvl === 1;
  const lay = onHost ? occT : occ;
  for(const [cx, cz] of cs){
    if(!validCell(type, cx, cz, onHost)) return false;
    if(cx < 0 || cz < 0 || cx >= GRID || cz >= GRID) return false;
    const cur = lay[oi(cx, cz)];
    if(cur !== -1 && cur !== ignore) return false;
  }
  return true;
}
/* Snap a click to the nearest spot the footprint legally fits (blocks for
   buildings, street cells for transit) so you can build almost anywhere. */
const SPIRAL = (() => {
  const out = [];
  for(let r = 0; r <= 5; r++) for(let dx = -r; dx <= r; dx++) for(let dz = -r; dz <= r; dz++)
    if(Math.max(Math.abs(dx), Math.abs(dz)) === r) out.push([dx, dz, dx*dx + dz*dz]);
  return out.sort((a, b) => a[2] - b[2]);
})();
function resolvePlacement(spec, gx, gz, rot){
  if(fits(spec, gx, gz, rot)) return [gx, gz];
  for(const [dx, dz] of SPIRAL){
    if(fits(spec, gx + dx, gz + dz, rot)) return [gx + dx, gz + dz];
  }
  return null;
}
/* Everything the footprint would sit on top of. */
function occupantsUnder(spec, gx, gz, rot, ignore, lvl){
  const set = new Set();
  const lay = lvl ? occT : occ;
  for(const [cx, cz] of cellsOf(spec, gx, gz, rot)){
    if(cx < 0 || cz < 0 || cx >= GRID || cz >= GRID) continue;
    const cur = lay[oi(cx, cz)];
    if(cur !== -1 && cur !== ignore) set.add(cur);
  }

}
function removeMany(list){

}
function stampOcc(idx, on){

    if(cx >= 0 && cz >= 0 && cx < GRID && cz < GRID) layer[oi(cx, cz)] = on ? idx : -1;
}
function reindexOcc(){

  for(let i = 0; i < state.objects.length; i++) if(state.objects[i].lvl) stampOcc(i, true);

/* Removing a host takes whatever was sitting on it. */
function withRiders(list){
  const out = new Set(list);
  for(const i of list){
    const o = state.objects[i];
    if(!o || o.lvl || !TYPES[o.type].hosts) continue;
    for(const [cx, cz] of cellsOf(o, o.gx, o.gz, o.rot)){
      if(cx < 0 || cz < 0 || cx >= GRID || cz >= GRID) continue;

  const useLvl = lvl === undefined ? layerFor(spec, gx, gz, rot).lvl : (lvl ? 1 : 0);
  const style = ob.style !== undefined ? ob.style : (hasStyle(type) ? randStyle() : 0);
  const o = {type, gx, gz, uid: uidSeq++, rot: (rot | 0) & 3, seed: Math.floor(rnd() * 100000) + 1,
             w, d, stories: ob.stories || T.stories || 0, style,
             sport: ob.sport !== undefined ? ob.sport : Math.floor(rnd() * 3),

function removeObject(idx){

const METRO_COLS = [[0.24,0.60,1.0],[1.0,0.44,0.34],[0.32,0.86,0.56],[1.0,0.80,0.28],[0.72,0.50,1.0]];

let metroMesh = null;
function buildMetro(){
  if(metroMesh){ scene.remove(metroMesh); metroMesh.geometry.dispose(); metroMesh = null; }
  const edges = G.metro || [];
  const anyTransit = state.objects.some(o => TYPES[o.type].kind === 'transit');
  if(!edges.length && !anyTransit) return;
  const B = newBatch(2048);
  // surface transit: tram, bike and walking routes, each at its own height
  for(const path of (G.tramPaths || [])){
    const sel = path.li === state.selLine;
    const col = sel ? [1, 1, 1] : METRO_COLS[(path.c | 0) % METRO_COLS.length];
    for(let i = 0; i < path.pts.length - 1; i++){
      const a = path.pts[i], b = path.pts[i + 1];
      const len = Math.hypot(b.x - a.x, b.z - a.z);
      if(!len) continue;
      const ry = Math.atan2(-(b.z - a.z), b.x - a.x);
      box(B, len + 1.5, sel ? 1.1 : 0.6, sel ? 9.4 : 7.6,
          (a.x + b.x) / 2, sel ? 2.9 : 2.4, (a.z + b.z) / 2, col, 0, ry);
    }
  }
  for(const o of state.objects){
    if(o.type !== 'tramstop') continue;
    const x = wx(o.gx), z = wz(o.gz);
    const on = lineOfStation(o.uid);
    const col = on.length ? METRO_COLS[(state.lines[on[0]].c | 0) % METRO_COLS.length] : [0.5, 0.53, 0.56];
    cyl(B, 1.1, 1.1, 8, 8, x, 4, z, [0.96, 0.97, 1.0], 0);
    cyl(B, 3.4, 3.4, 0.4, 16, x, 0.55, z, on.length ? [0.96,0.97,1.0] : [0.5,0.53,0.56], 0);
    box(B, 2.2, 2.2, 2.2, x, 8.6, z, col, 0, Math.PI / 4);
  }
  const SURF = {tram:{c:[0.95,0.42,0.32], w:7.4, y:2.1},
                bike:{c:[0.28,0.80,0.70], w:4.8, y:1.5},
                walk:{c:[0.92,0.86,0.72], w:5.8, y:1.0}};
  for(const o of state.objects){
    const cfg = SURF[o.type];
    if(!cfg) continue;
    const x = wx(o.gx), z = wz(o.gz);
    const ax = cellAxis(o.gx, o.gz);
    if(ax === 'x' || ax === 'both') box(B, CELL + 0.2, 0.55, cfg.w, x, cfg.y, z, cfg.c, 0);
    if(ax === 'z' || ax === 'both') box(B, cfg.w, 0.55, CELL + 0.2, x, cfg.y, z, cfg.c, 0);
  }
  edges.forEach(([a, b, ci, li]) => {
    const x0 = G.x[a], z0 = G.z[a], x1 = G.x[b], z1 = G.z[b];
    const len = Math.hypot(x1 - x0, z1 - z0);
    const ry = Math.atan2(-(z1 - z0), x1 - x0);
    const sel = li === state.selLine;
    const col = sel ? [1, 1, 1] : METRO_COLS[(ci | 0) % METRO_COLS.length];
    const y = 9 + (ci | 0) * 0.9;                     // lines stack slightly, so parallels read
    box(B, len, sel ? 2.6 : 1.8, sel ? 4.6 : 3.4, (x0 + x1) / 2, y, (z0 + z1) / 2, col, 0, ry);
    box(B, len, 0.4, 6.0, (x0 + x1) / 2, 0.4, (z0 + z1) / 2, shade(col, 0.55), 0, ry);
  });
  for(const o of state.objects){
    if(o.type !== 'subway') continue;
    const x = wx(o.gx), z = wz(o.gz);
    const on = lineOfStation(o.uid);
    const linked = on.length > 0;
    const pale = linked ? [0.96, 0.97, 1.0] : [0.52, 0.56, 0.60];
    cyl(B, 1.5, 1.5, 20, 10, x, 10, z, pale, 0);
    cyl(B, linked ? 5.4 : 4.0, linked ? 5.4 : 4.0, 0.5, 18, x, 0.5, z, pale, 0);
    cyl(B, 3.6, 3.6, 0.6, 18, x, 20.4, z, pale, 0);
    const cap = on.length > 1 ? [1, 1, 1]
              : linked ? METRO_COLS[(state.lines[on[0]].c | 0) % METRO_COLS.length]
              : [0.38, 0.41, 0.45];
    box(B, on.length > 1 ? 3.6 : 2.6, on.length > 1 ? 3.6 : 2.6, on.length > 1 ? 3.6 : 2.6,
        x, 23, z, cap, 0, Math.PI / 4);
  }
  const parts = B.geo.slice();
  const bg = batchGeometry(B);
  if(bg) parts.unshift(bg);
  if(!parts.length) return;
  const g = parts.length === 1 ? parts[0] : mergeGeometries(parts, false);
  if(parts.length > 1) parts.forEach(x => x.dispose());
  if(!g) return;
  metroMesh = new THREE.Mesh(g, matMetro);

      segs.push({x0:a.x, z0:a.z, x1:b.x, z1:b.z, y:1.6, h:3.2, w:8.4, li:path.li});
    }
  }
  for(const [a, b, , li] of (G.metro || [])){
    segs.push({x0:G.x[a], z0:G.z[a], x1:G.x[b], z1:G.z[b], y:10, h:5, w:6, li});
  }
  if(!segs.length) return;
  const mat = new THREE.MeshBasicMaterial();
  mat.visible = false;
  linePickMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, segs.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  const up = new THREE.Vector3(0,1,0);
  segs.forEach((sg, i) => {
    const len = Math.hypot(sg.x1 - sg.x0, sg.z1 - sg.z0) || 1;
    sc.set(len, sg.h, sg.w);
    q.setFromAxisAngle(up, Math.atan2(-(sg.z1 - sg.z0), sg.x1 - sg.x0));
    p.set((sg.x0 + sg.x1) / 2, sg.y, (sg.z0 + sg.z1) / 2);
    m.compose(p, q, sc);
    linePickMesh.setMatrixAt(i, m);
    linePickLine.push(sg.li);

  linePickMesh.frustumCulled = false;
  scene.add(linePickMesh);
}
function pickLine(e){
  if(!linePickMesh) return -1;
  pointerNDC(e);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(linePickMesh, false);
  for(const h of hits){
    const id = h.instanceId;
    if(id === undefined) continue;
    const li = linePickLine[id];
    const L = state.lines[li];
    if(!L) continue;
    if(modeOf(L) === 'subway' && !state.metro) continue;   // tunnels only in transit view

  }

}
